AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  jstock_advisor - 日本株 長期・高配当・株主優待重視の売買支援システム。
  config/schedule.yamlの各ジョブに対応するLambda関数、DynamoDBテーブル、
  LINE Webhook用API Gatewayを定義する。

Parameters:
  TablePrefix:
    Type: String
    Default: jstock
    Description: DynamoDBテーブル名の接頭辞(build_collection_storeのDYNAMODB_TABLE_PREFIXと一致させる)
  EdinetApiKeySecretArn:
    Type: String
    Description: >
      EDINET_API_KEYを保持するSecrets ManagerシークレットのARN。
      事前に`aws secretsmanager create-secret`等で作成し、
      `aws secretsmanager put-secret-value`で値を投入してから指定する。
  LineChannelAccessTokenSecretArn:
    Type: String
    Description: LINE_CHANNEL_ACCESS_TOKENを保持するSecrets ManagerシークレットのARN
  LineUserIdSecretArn:
    Type: String
    Description: LINE_USER_IDを保持するSecrets ManagerシークレットのARN(本人確認・Webhook認可にも使用)
  LineChannelSecretSecretArn:
    Type: String
    Description: LINE_CHANNEL_SECRETを保持するSecrets ManagerシークレットのARN(Webhook署名検証用)
  WatchlistReservedConcurrentExecutions:
    Type: Number
    Default: 3
    Description: >
      候補ユニバース本格対応(2026-08)。WatchlistWorkerFunctionの同時実行数上限。
      Yahoo Financeへの同時アクセスを抑制する(3節)。
  WatchlistSqsBatchSize:
    Type: Number
    Default: 1
    Description: >
      候補ユニバース本格対応(2026-08)。WatchlistScreeningQueueのLambdaトリガー
      BatchSize。初期値は1(3節)、安定稼働後に引き上げ可能。

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Timeout: 300
    MemorySize: 512
    Layers:
      - !Ref DependenciesLayer
      - !Ref ConfigLayer
    Environment:
      Variables:
        DYNAMODB_TABLE_PREFIX: !Ref TablePrefix
        JSTOCK_CONFIG_DIR: /opt
        EDINET_API_KEY: !Sub "{{resolve:secretsmanager:${EdinetApiKeySecretArn}:SecretString}}"
        LINE_CHANNEL_ACCESS_TOKEN: !Sub "{{resolve:secretsmanager:${LineChannelAccessTokenSecretArn}:SecretString}}"
        LINE_USER_ID: !Sub "{{resolve:secretsmanager:${LineUserIdSecretArn}:SecretString}}"

Resources:
  # --- 候補ユニバース本格対応(2026-08): S3キャッシュバケット ------------------
  # 東証上場銘柄一覧・JPX400構成銘柄のcurrent/archiveレイアウトを保存する
  # (services/candidate_universe_downloader.py)。非機能要件: 暗号化・バージョニング・
  # TLS-onlyポリシー・パブリックアクセスブロック・ライフサイクル(archive/の
  # 世代を1年で失効、非最新バージョンを90日で失効)。

  CandidateUniverseCacheBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-candidate-universe-cache"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArchiveGenerations
            Status: Enabled
            Prefix: archive/
            ExpirationInDays: 365
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90

  CandidateUniverseCacheBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CandidateUniverseCacheBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt CandidateUniverseCacheBucket.Arn
              - !Sub "${CandidateUniverseCacheBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # --- 候補ユニバース本格対応(2026-08): SQSキュー ----------------------------
  # WatchlistScreeningQueue(メイン、BatchSize=1) → maxReceiveCount 3回失敗で
  # WatchlistTerminalFailureQueue(作業用、自動消費してFAILED確定) →
  # Handler自体が3回失敗した場合のみWatchlistTerminalFailureDLQ(真正のDLQ、
  # 何も自動消費しない、ApproximateNumberOfMessagesVisibleへのCloudWatch Alarmを
  # 運用側で設定すること、4節)。

  WatchlistTerminalFailureDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-watchlist-terminal-failure-dlq"
      MessageRetentionPeriod: 1209600 # 14日(運用調査用に長めに保持)

  WatchlistTerminalFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-watchlist-terminal-failure"
      VisibilityTimeout: 120 # WatchlistTerminalFailureHandlerFunctionのTimeout(60秒)+余裕
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WatchlistTerminalFailureDLQ.Arn
        maxReceiveCount: 3

  WatchlistScreeningQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-watchlist-screening"
      VisibilityTimeout: 1080 # 3節: WatchlistWorkerFunctionのLambda Timeout(180秒)の6倍
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WatchlistTerminalFailureQueue.Arn
        maxReceiveCount: 3

  # --- Lambda Layer(依存パッケージ) -------------------------------------

  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-deps"
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.12

  ConfigLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-config"
      ContentUri: ../config/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete

  # --- DynamoDBテーブル ----------------------------------------------------
  # オンデマンド課金(個人利用規模でアクセス頻度が低く予測しづらいため)。
  # 各テーブルはinfrastructure/collection_store.pyのresolve_table_name()が
  # 計算する名前(${TablePrefix}-<file_nameから.jsonを除いたもの>)と一致させる。

  HoldingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-holdings"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stock_code
          AttributeType: S
      KeySchema:
        - AttributeName: stock_code
          KeyType: HASH

  PurchaseLotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-purchase_lots"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: lot_id
          AttributeType: S
      KeySchema:
        - AttributeName: lot_id
          KeyType: HASH

  WatchlistTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-watchlist"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stock_code
          AttributeType: S
      KeySchema:
        - AttributeName: stock_code
          KeyType: HASH

  RecommendationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-recommendations"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: recommendation_id
          AttributeType: S
      KeySchema:
        - AttributeName: recommendation_id
          KeyType: HASH

  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-transactions"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: transaction_id
          AttributeType: S
      KeySchema:
        - AttributeName: transaction_id
          KeyType: HASH

  SkippedRecommendationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-skipped_recommendations"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: recommendation_id
          AttributeType: S
      KeySchema:
        - AttributeName: recommendation_id
          KeyType: HASH

  NotificationLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-notification_log"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: notification_id
          AttributeType: S
      KeySchema:
        - AttributeName: notification_id
          KeyType: HASH

  EvaluationResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-evaluation_results"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: evaluation_id
          AttributeType: S
      KeySchema:
        - AttributeName: evaluation_id
          KeyType: HASH

  RuleVersionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-rule_versions"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: rule_version
          AttributeType: S
      KeySchema:
        - AttributeName: rule_version
          KeyType: HASH

  RuleProposalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-rule_proposals"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: proposal_id
          AttributeType: S
      KeySchema:
        - AttributeName: proposal_id
          KeyType: HASH

  UserFeedbackTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-user_feedback"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: feedback_id
          AttributeType: S
      KeySchema:
        - AttributeName: feedback_id
          KeyType: HASH

  AuditLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-audit_log"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: audit_id
          AttributeType: S
      KeySchema:
        - AttributeName: audit_id
          KeyType: HASH

  ShareholderBenefitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-shareholder_benefits"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stock_code
          AttributeType: S
      KeySchema:
        - AttributeName: stock_code
          KeyType: HASH

  CorporateActionRegistryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-corporate_action_registry"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH

  # 銘柄名の手動オーバーライド(2026-07 BUYパイプライン第2次修正・要求仕様19節)。
  StockNameOverridesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-stock_name_overrides"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stock_code
          AttributeType: S
      KeySchema:
        - AttributeName: stock_code
          KeyType: HASH

  EdinetFilingCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-edinet_filing_cache"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stock_code
          AttributeType: S
      KeySchema:
        - AttributeName: stock_code
          KeyType: HASH

  EdinetDisclosureCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-edinet_disclosure_cache"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stock_code
          AttributeType: S
      KeySchema:
        - AttributeName: stock_code
          KeyType: HASH

  # 銘柄単位ファンアウト(_fanout.py)の完了検知用。原子的なADDカウンタとして
  # infrastructure/aws/batch_tracker.pyから直接操作するため、他テーブルと異なり
  # {id_field, data: JSON}形式ではなく数値属性を直接持つ。TTLで数時間後に自動削除する
  BatchRunsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-batch_runs"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: batch_id
          AttributeType: S
      KeySchema:
        - AttributeName: batch_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # 候補ユニバース本格対応(2026-08)。銘柄単位の進捗・冪等性・リース状態を保持する
  # (PK: batch_id, SK: stock_code)。infrastructure/aws/batch_tracker.pyの
  # ウォッチリスト専用関数群(query_all_candidate_progress等)が操作する。
  WatchlistCandidateProgressTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-watchlist_candidate_progress"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: batch_id
          AttributeType: S
        - AttributeName: stock_code
          AttributeType: S
      KeySchema:
        - AttributeName: batch_id
          KeyType: HASH
        - AttributeName: stock_code
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # --- Lambda関数(スケジュール実行、schedule.yaml対応) ------------------

  BuyCandidatesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-buy-candidates"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.buy_candidates_handler.handler
      # 24節仕様の再設計(モメンタム・複数手法適正価格・分割調整等)で銘柄あたりの
      # 実データ取得件数が増えたため、既定の300秒では銘柄数によってはタイムアウトしうる
      Timeout: 900
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AuditLogTable }
        - DynamoDBCrudPolicy: { TableName: !Ref RecommendationsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref NotificationLogTable }
        - DynamoDBReadPolicy: { TableName: !Ref WatchlistTable }
        # 統合BUY候補パイプライン(2026-07)で保有銘柄を購入判断対象へ統合したため追加
        - DynamoDBReadPolicy: { TableName: !Ref HoldingsTable }
        - DynamoDBReadPolicy: { TableName: !Ref PurchaseLotsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref EdinetFilingCacheTable }
        - DynamoDBCrudPolicy: { TableName: !Ref EdinetDisclosureCacheTable }
        - DynamoDBReadPolicy: { TableName: !Ref ShareholderBenefitsTable }
        - DynamoDBReadPolicy: { TableName: !Ref CorporateActionRegistryTable }
        - DynamoDBReadPolicy: { TableName: !Ref RuleVersionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref BatchRunsTable }
        - DynamoDBReadPolicy: { TableName: !Ref StockNameOverridesTable }
        # 銘柄単位のファンアウト(_fanout.py)のため、自分自身を非同期呼び出しする権限が必要
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-buy-candidates"
      Events:
        DailyMorning:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 8 ? * MON-FRI *)"
            ScheduleExpressionTimezone: Asia/Tokyo
            FlexibleTimeWindow:
              Mode: "OFF"

  HoldingsWatchlistFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-holdings-watchlist"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.holdings_watchlist_handler.handler
      # 保有銘柄27件+ウォッチリストを、24節仕様の再設計後の判定ロジック
      # (モメンタム・複数手法適正価格・分割調整等)で処理するため、既定の300秒では
      # 不足する。Lambdaの最大値である900秒まで引き上げる
      Timeout: 900
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AuditLogTable }
        - DynamoDBCrudPolicy: { TableName: !Ref RecommendationsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref NotificationLogTable }
        - DynamoDBReadPolicy: { TableName: !Ref HoldingsTable }
        - DynamoDBReadPolicy: { TableName: !Ref PurchaseLotsTable }
        - DynamoDBReadPolicy: { TableName: !Ref WatchlistTable }
        - DynamoDBCrudPolicy: { TableName: !Ref EdinetFilingCacheTable }
        - DynamoDBCrudPolicy: { TableName: !Ref EdinetDisclosureCacheTable }
        - DynamoDBReadPolicy: { TableName: !Ref ShareholderBenefitsTable }
        - DynamoDBReadPolicy: { TableName: !Ref CorporateActionRegistryTable }
        - DynamoDBReadPolicy: { TableName: !Ref RuleVersionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref BatchRunsTable }
        - DynamoDBReadPolicy: { TableName: !Ref StockNameOverridesTable }
        # 銘柄単位のファンアウト(_fanout.py)のため、自分自身を非同期呼び出しする権限が必要
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-holdings-watchlist"
      Events:
        # 買い候補分析(BuyCandidatesFunction)と処理条件・通知タイミングを揃えるため
        # 08:00に変更(2026-07-31改訂)。以前は16:30(当日終値)だったが、買い判定と
        # 同時刻にすることで両方とも前営業日終値を基準に同じ条件で評価するようになる。
        DailyMorning:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 8 ? * MON-FRI *)"
            ScheduleExpressionTimezone: Asia/Tokyo
            FlexibleTimeWindow:
              Mode: "OFF"

  DisclosureCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-disclosure-check"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.disclosure_check_handler.handler
      Timeout: 180
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref HoldingsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref NotificationLogTable }
        - DynamoDBCrudPolicy: { TableName: !Ref EdinetDisclosureCacheTable }
      Events:
        Morning:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 10 ? * MON-FRI *)"
            ScheduleExpressionTimezone: Asia/Tokyo
            FlexibleTimeWindow:
              Mode: "OFF"
        Midday:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(30 12 ? * MON-FRI *)"
            ScheduleExpressionTimezone: Asia/Tokyo
            FlexibleTimeWindow:
              Mode: "OFF"
        Afternoon:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(30 15 ? * MON-FRI *)"
            ScheduleExpressionTimezone: Asia/Tokyo
            FlexibleTimeWindow:
              Mode: "OFF"

  EvaluationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-evaluation"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.evaluation_handler.handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref RecommendationsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref EvaluationResultsTable }
      Events:
        DailyEvening:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 18 ? * MON-FRI *)"
            ScheduleExpressionTimezone: Asia/Tokyo
            FlexibleTimeWindow:
              Mode: "OFF"

  # --- ウォッチリスト自動追加(候補ユニバース本格対応・2026-08) ---------------
  # 旧WatchlistAutoAdditionFunction(単一Lambdaの自己再帰fan-out)を、
  # Dispatcher→SQS→Worker、TerminalFailureQueue→Handler、毎時Reconcilerという
  # 4つのLambdaへ分割した(第6版修正プラン)。共通のDynamoDBポリシー・IAM構成:
  # AuditLog/BatchRuns/WatchlistCandidateProgress/WatchlistへのCRUD、Holdings等の
  # 除外判定・データ取得用テーブルへの読み取り。

  WatchlistDispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-watchlist-dispatcher"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.watchlist_dispatcher_handler.handler
      Timeout: 300 # 3/18節: dispatch leaseの算出根拠(300秒+60秒余裕=360秒)
      Environment:
        Variables:
          WATCHLIST_SCREENING_QUEUE_URL: !Ref WatchlistScreeningQueue
          CANDIDATE_UNIVERSE_CACHE_BUCKET: !Ref CandidateUniverseCacheBucket
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AuditLogTable }
        - DynamoDBCrudPolicy: { TableName: !Ref BatchRunsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WatchlistCandidateProgressTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WatchlistTable }
        - DynamoDBCrudPolicy: { TableName: !Ref NotificationLogTable }
        - DynamoDBReadPolicy: { TableName: !Ref HoldingsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref EdinetFilingCacheTable }
        - DynamoDBCrudPolicy: { TableName: !Ref EdinetDisclosureCacheTable }
        - DynamoDBReadPolicy: { TableName: !Ref ShareholderBenefitsTable }
        - DynamoDBReadPolicy: { TableName: !Ref CorporateActionRegistryTable }
        - DynamoDBReadPolicy: { TableName: !Ref StockNameOverridesTable }
        - S3CrudPolicy: { BucketName: !Ref CandidateUniverseCacheBucket }
        - SQSSendMessagePolicy: { QueueName: !GetAtt WatchlistScreeningQueue.QueueName }
      Events:
        # 市場取引時間外、既存の土曜実行バッチ(WeeklyReview 09:00/MonthlyReview 10:00/
        # QuarterlyReview 11:00 JST)と重ならず、翌営業日である月曜08:00のBUY候補
        # バッチより十分前に完了できる時間帯として毎週土曜07:00 JSTを選定した。
        SaturdayEarlyMorning:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 7 ? * SAT *)"
            ScheduleExpressionTimezone: Asia/Tokyo
            FlexibleTimeWindow:
              Mode: "OFF"

  WatchlistWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-watchlist-worker"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.watchlist_worker_handler.handler
      Timeout: 180 # 3節
      ReservedConcurrentExecutions: !Ref WatchlistReservedConcurrentExecutions
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AuditLogTable }
        - DynamoDBCrudPolicy: { TableName: !Ref BatchRunsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WatchlistCandidateProgressTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WatchlistTable }
        - DynamoDBCrudPolicy: { TableName: !Ref NotificationLogTable }
        - DynamoDBReadPolicy: { TableName: !Ref HoldingsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref EdinetFilingCacheTable }
        - DynamoDBCrudPolicy: { TableName: !Ref EdinetDisclosureCacheTable }
        - DynamoDBReadPolicy: { TableName: !Ref ShareholderBenefitsTable }
        - DynamoDBReadPolicy: { TableName: !Ref CorporateActionRegistryTable }
        - DynamoDBReadPolicy: { TableName: !Ref StockNameOverridesTable }
      Events:
        ScreeningQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt WatchlistScreeningQueue.Arn
            BatchSize: !Ref WatchlistSqsBatchSize
            MaximumBatchingWindowInSeconds: 0

  WatchlistTerminalFailureHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-watchlist-terminal-failure-handler"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.watchlist_terminal_failure_handler.handler
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AuditLogTable }
        - DynamoDBCrudPolicy: { TableName: !Ref BatchRunsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WatchlistCandidateProgressTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WatchlistTable }
        - DynamoDBCrudPolicy: { TableName: !Ref NotificationLogTable }
        - DynamoDBReadPolicy: { TableName: !Ref HoldingsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref EdinetFilingCacheTable }
        - DynamoDBCrudPolicy: { TableName: !Ref EdinetDisclosureCacheTable }
        - DynamoDBReadPolicy: { TableName: !Ref ShareholderBenefitsTable }
        - DynamoDBReadPolicy: { TableName: !Ref CorporateActionRegistryTable }
        - DynamoDBReadPolicy: { TableName: !Ref StockNameOverridesTable }
      Events:
        TerminalFailureQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt WatchlistTerminalFailureQueue.Arn
            BatchSize: 10

  WatchlistBatchReconcilerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-watchlist-batch-reconciler"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.watchlist_batch_reconciler_handler.handler
      Timeout: 300
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AuditLogTable }
        - DynamoDBCrudPolicy: { TableName: !Ref BatchRunsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WatchlistCandidateProgressTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WatchlistTable }
        - DynamoDBCrudPolicy: { TableName: !Ref NotificationLogTable }
        - DynamoDBReadPolicy: { TableName: !Ref HoldingsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref EdinetFilingCacheTable }
        - DynamoDBCrudPolicy: { TableName: !Ref EdinetDisclosureCacheTable }
        - DynamoDBReadPolicy: { TableName: !Ref ShareholderBenefitsTable }
        - DynamoDBReadPolicy: { TableName: !Ref CorporateActionRegistryTable }
        - DynamoDBReadPolicy: { TableName: !Ref StockNameOverridesTable }
      Events:
        Hourly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "rate(1 hour)"
            FlexibleTimeWindow:
              Mode: "OFF"

  WeeklyReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-weekly-review"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.weekly_review_handler.handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref EvaluationResultsTable }
        - DynamoDBReadPolicy: { TableName: !Ref RecommendationsTable }
        - DynamoDBReadPolicy: { TableName: !Ref RuleProposalsTable }
      Events:
        SaturdayMorning:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 9 ? * SAT *)"
            ScheduleExpressionTimezone: Asia/Tokyo
            FlexibleTimeWindow:
              Mode: "OFF"

  MonthlyReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-monthly-review"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.monthly_review_handler.handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref EvaluationResultsTable }
        - DynamoDBReadPolicy: { TableName: !Ref RecommendationsTable }
        - DynamoDBReadPolicy: { TableName: !Ref RuleProposalsTable }
      Events:
        # 毎週土曜に起動し、当月第1土曜日かはLambda側(_scheduling.py)で判定する
        SaturdayMorning:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 10 ? * SAT *)"
            ScheduleExpressionTimezone: Asia/Tokyo
            FlexibleTimeWindow:
              Mode: "OFF"

  QuarterlyReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-quarterly-review"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.quarterly_review_handler.handler
      Events:
        # 毎週土曜に起動し、1/4/7/10月の第1土曜日かはLambda側で判定する
        SaturdayMorning:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 11 ? * SAT *)"
            ScheduleExpressionTimezone: Asia/Tokyo
            FlexibleTimeWindow:
              Mode: "OFF"

  # --- LINE Webhook(API Gateway経由、チャット起点の売買記録・ウォッチ登録) --

  LineWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-line-webhook"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.line_webhook_handler.handler
      Timeout: 30
      Environment:
        Variables:
          LINE_CHANNEL_SECRET: !Sub "{{resolve:secretsmanager:${LineChannelSecretSecretArn}:SecretString}}"
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TransactionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref SkippedRecommendationsTable }
        - DynamoDBReadPolicy: { TableName: !Ref RecommendationsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WatchlistTable }
        - DynamoDBCrudPolicy: { TableName: !Ref HoldingsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref PurchaseLotsTable }
      Events:
        Webhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /webhook
            Method: POST

  WebhookApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod

Outputs:
  WebhookUrl:
    Description: >
      LINE DevelopersコンソールのWebhook URLに設定するエンドポイント。
      デプロイ後、この値を「https://<ここ>/webhook」の形でMessaging API設定に登録する。
      検証(Verify)を押す前に、4つのSecrets Managerシークレットへ値を投入しておくこと。
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
