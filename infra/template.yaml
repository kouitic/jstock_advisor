  # --- 判定精度向上機能Phase A(2026-08): 自己評価基盤 -------------------------

  DecisionSnapshotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-decision_snapshots"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: decision_id
          AttributeType: S
      KeySchema:
        - AttributeName: decision_id
          KeyType: HASH

  # 買い候補サマリー表示改修(2026-08)。将来のLINE詳細理由照会機能に向けた参照用
  # ストア(BuyCandidateEvaluationRecordRepository参照)。Recommendation/
  # DecisionSnapshotの代替ではなく、無期限に増加させないため既定90日でTTL削除する。
  BuyCandidateEvaluationRecordsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-buy_candidate_evaluation_records"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: evaluation_id
          AttributeType: S
        # LINE UI第二弾「対象確認」機能(2026-08)向け。GSI(batch_id-index)の
        # HASHキー。evaluation_id(batch_id:stock_codeの複合文字列)からは
        # batch_id単体でのQueryができないため追加した。デプロイ前に書き込まれた
        # 既存レコードにはbatch_id属性(トップレベル)が無く、DynamoDBのGSIは
        # スパースインデックスのためそれらはGSIに載らない(実害無し、詳細は
        # BuyCandidateEvaluationRecordRepository参照)。
        - AttributeName: batch_id
          AttributeType: S
      KeySchema:
        - AttributeName: evaluation_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: batch_id-index
          KeySchema:
            - AttributeName: batch_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  HoldingEvaluationRecordsTable:
    # Phase 2-B「銘柄分析」向け(2026-08)。保有銘柄1回の評価ごとに1件、どの
    # エンジン(Legacy SELL/ProfitTaking/HoldingDecisionScore)が実際の判定担当
    # だったかを記録する。BuyCandidateEvaluationRecordsTableと対称的な設計。
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-holding_evaluation_records"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: holding_evaluation_id
          AttributeType: S
        # GSI(holding_id-index)のHASH/RANGEキー。holding_id(owner#stock_code)
        # 単体でのQueryができないため追加した(FilterExpressionでのowner絞り込み
        # は行わない設計、HoldingEvaluationRecordRepository参照)。
        - AttributeName: holding_id
          AttributeType: S
        - AttributeName: evaluated_at
          AttributeType: S
      KeySchema:
        - AttributeName: holding_evaluation_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: holding_id-index
          KeySchema:
            - AttributeName: holding_id
              KeyType: HASH
            - AttributeName: evaluated_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # LINE UI第二弾「対象確認」機能(2026-08)向け。単一行(pointer_id="default"
  # 固定)のみを保持する、直近完了BUY候補batchの永続ポインタ。BatchRunsTable
  # (TTL6時間、買い候補パイプラインではstatus更新自体を行わない)では
  # 「最新完了batch」を長期に特定できないため新設した。書き込みは
  # buy_candidates_handler._finalize_batch()からNORMAL運用かつ全対象銘柄分の
  # BuyCandidateEvaluationRecord保存成功時のみ行う。TTLは持たせない(常に
