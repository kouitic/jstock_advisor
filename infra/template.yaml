          KeyType: HASH

  SkippedRecommendationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-skipped_recommendations"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: recommendation_id
          AttributeType: S
      KeySchema:
        - AttributeName: recommendation_id
