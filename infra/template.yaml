  NotificationLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-notification_log"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: notification_id
          AttributeType: S
      KeySchema:
        - AttributeName: notification_id
          KeyType: HASH

  # --- LINE通知dedupの原子化(Issue #17): 送信決定claimテーブル ---------------
  # claim_id = identity文字列のSHA-256(64桁hex)。TTL(ttl属性、30日)はcleanup
  # 専用であり、送信可否・stale判定には使わない(stale判定はアプリ側の
  # claimed_at比較のみ。DynamoDB TTL削除は最大48時間程度遅延しうるため)。
  NotificationClaimsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-notification_claims"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: claim_id
          AttributeType: S
      KeySchema:
        - AttributeName: claim_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  EvaluationResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-evaluation_results"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: evaluation_id
          AttributeType: S
      KeySchema:
        - AttributeName: evaluation_id
          KeyType: HASH

  RuleVersionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-rule_versions"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: rule_version
          AttributeType: S
      KeySchema:
        - AttributeName: rule_version
          KeyType: HASH

  RuleProposalsTable:
