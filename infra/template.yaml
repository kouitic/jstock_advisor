AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  jstock_advisor - 日本株 長期・高配当・株主優待重視の売買支援システム。
  config/schedule.yamlの各ジョブに対応するLambda関数、DynamoDBテーブル、
  LINE Webhook用API Gatewayを定義する。

Parameters:
  TablePrefix:
    Type: String
    Default: jstock
    Description: DynamoDBテーブル名の接頭辞(build_collection_storeのDYNAMODB_TABLE_PREFIXと一致させる)
  EdinetApiKeySecretArn:
    Type: String
    Description: >
      EDINET_API_KEYを保持するSecrets ManagerシークレットのARN。
      事前に`aws secretsmanager create-secret`等で作成し、
      `aws secretsmanager put-secret-value`で値を投入してから指定する。
  LineChannelAccessTokenSecretArn:
    Type: String
    Description: LINE_CHANNEL_ACCESS_TOKENを保持するSecrets ManagerシークレットのARN
  LineUserIdSecretArn:
    Type: String
    Description: LINE_USER_IDを保持するSecrets ManagerシークレットのARN(本人確認・Webhook認可にも使用)
  LineChannelSecretSecretArn:
    Type: String
    Description: LINE_CHANNEL_SECRETを保持するSecrets ManagerシークレットのARN(Webhook署名検証用)
  LineCredentialRotationVersion:
    Type: String
    Default: "0"
    Description: >
      Issue #117 Phase R1。LINE認証情報のローテーション時に**明示的に値を変える**ための
      非秘密マーカー。Secrets Managerの値だけを更新してもdynamic referenceは再解決
      されず(リソースに実変更が無いとCloudFormationがNO_CHANGESとするため)、Lambdaは
      旧credentialのまま動き続ける。この値を変更するとGlobalsのEnvironmentが変わり、
      全Lambda関数がModify対象になるため再解決が確実に起きる。
      **秘密値・トークン・キーを入れないこと**(この値は環境変数として平文で残る)。
      通常のデプロイでは既定値のまま変更しない(変更しなければ再解決を意図しない)。
  EdinetCredentialRotationVersion:
    Type: String
    Default: "0"
    Description: >
      Issue #117 Phase R1。EDINET認証情報のローテーション用の非秘密マーカー。
      役割はLineCredentialRotationVersionと同じで、**LINEとEDINETを同一波で
      ローテーションしない**運用方針に合わせて独立したパラメータとする
      (ChangeSet上で「どちらのローテーションを意図した変更か」を識別可能にする)。
      **秘密値・キーを入れないこと。**
  WatchlistReservedConcurrentExecutions:
    Type: Number
    Default: 4
    Description: >
      候補ユニバース本格対応(2026-08)。WatchlistWorkerFunctionの同時実行数上限。
      Yahoo Financeへの同時アクセスを抑制する(3節)。2026-08-20、Issue #4の
      実施基準充足(SQS OldestMessage最大69分・Throttles最大3,158件/日・
      429率実質0%)を確認し、3→4へ段階的に引き上げ(検証用、悪化があれば3へ
      ロールバック)。
  WatchlistSqsBatchSize:
    Type: Number
    Default: 1
    Description: >
      候補ユニバース本格対応(2026-08)。WatchlistScreeningQueueのLambdaトリガー
      BatchSize。初期値は1(3節)、安定稼働後に引き上げ可能。
  AllowFullMarketScreening:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      本番運用ハードニング(2節)。"true"の場合のみ、staged_rollout.candidate_limitが
      null(全件処理)の週次バッチ開始を許可する。運用者が明示的に
      `--parameter-overrides AllowFullMarketScreening=true`を指定しない限り、
      全件処理は起動時に拒否される(段階導入の安全側デフォルトと対になる二重の安全策)。
  GithubAppSecretArn:
    Type: String
    Default: "arn:aws:secretsmanager:ap-northeast-1:970547364058:secret:jstock/github-app-not-configured"
    Description: >
      振り返り機能改修(2026-08)。週次改善レビューのGitHub Issue自動起票に使う
      GitHub App認証情報({"app_id","installation_id","private_key"}のJSON)を
      保持するSecrets ManagerシークレットのARN。GitHub App作成・インストール・
      Secrets登録完了までは、既定値(未作成のダミーARN)のままでよい
      (config/review_improvement.yamlのissue_creation_enabled=falseにより、
      このシークレットは実際には参照されない)。実際のARNへ差し替えたら
      config/review_improvement.yamlをissue_creation_enabled: trueへ変更し
      再デプロイすること。
  GithubRepository:
    Type: String
    Default: ""
    Description: >
      振り返り機能改修(2026-08)。GitHub Issueを作成する対象リポジトリ
      ("owner/repo"形式)。未設定の間はGitHub Issue自動起票を行わない。

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Timeout: 300
    MemorySize: 512
    Layers:
      - !Ref DependenciesLayer
      - !Ref ConfigLayer
    Environment:
      Variables:
        DYNAMODB_TABLE_PREFIX: !Ref TablePrefix
        JSTOCK_CONFIG_DIR: /opt
        EDINET_API_KEY: !Sub "{{resolve:secretsmanager:${EdinetApiKeySecretArn}:SecretString}}"
        LINE_CHANNEL_ACCESS_TOKEN: !Sub "{{resolve:secretsmanager:${LineChannelAccessTokenSecretArn}:SecretString}}"
        LINE_USER_ID: !Sub "{{resolve:secretsmanager:${LineUserIdSecretArn}:SecretString}}"
        # Issue #117 Phase R1: ローテーション時の強制再解決マーカー(非秘密)。
        # 上の3つのdynamic referenceと**同じEnvironmentブロック**に置くことが要件で、
        # この値が変わればブロック全体が変更されて再解決が起きる。
        # 値は運用者が明示的に渡す非秘密の版数であり、秘密を入れてはならない。
        LINE_CREDENTIAL_ROTATION_VERSION: !Ref LineCredentialRotationVersion
        EDINET_CREDENTIAL_ROTATION_VERSION: !Ref EdinetCredentialRotationVersion

Resources:
  # --- 候補ユニバース本格対応(2026-08): S3キャッシュバケット ------------------
  # 東証上場銘柄一覧・JPX400構成銘柄のcurrent/archiveレイアウトを保存する
  # (services/candidate_universe_downloader.py)。非機能要件: 暗号化・バージョニング・
  # TLS-onlyポリシー・パブリックアクセスブロック・ライフサイクル(archive/の
  # 世代を1年で失効、非最新バージョンを90日で失効)。

  CandidateUniverseCacheBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-candidate-universe-cache"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArchiveGenerations
            Status: Enabled
            Prefix: archive/
            ExpirationInDays: 365
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90

  CandidateUniverseCacheBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CandidateUniverseCacheBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt CandidateUniverseCacheBucket.Arn
              - !Sub "${CandidateUniverseCacheBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # --- 候補ユニバース本格対応(2026-08): SQSキュー ----------------------------
  # WatchlistScreeningQueue(メイン、BatchSize=1) → maxReceiveCount 3回失敗で
  # WatchlistTerminalFailureQueue(作業用、自動消費してFAILED確定) →
  # Handler自体が3回失敗した場合のみWatchlistTerminalFailureDLQ(真正のDLQ、
  # 何も自動消費しない、ApproximateNumberOfMessagesVisibleへのCloudWatch Alarmを
  # 運用側で設定すること、4節)。

  WatchlistTerminalFailureDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-watchlist-terminal-failure-dlq"
      MessageRetentionPeriod: 1209600 # 14日(運用調査用に長めに保持)

  WatchlistTerminalFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-watchlist-terminal-failure"
      VisibilityTimeout: 120 # WatchlistTerminalFailureHandlerFunctionのTimeout(60秒)+余裕
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WatchlistTerminalFailureDLQ.Arn
        maxReceiveCount: 3

  WatchlistScreeningQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-watchlist-screening"
      VisibilityTimeout: 1080 # 3節: WatchlistWorkerFunctionのLambda Timeout(180秒)の6倍
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WatchlistTerminalFailureQueue.Arn
        maxReceiveCount: 3

  # --- Lambda Layer(依存パッケージ) -------------------------------------

  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-deps"
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.12

  ConfigLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-config"
      ContentUri: ../config/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete

  # --- DynamoDBテーブル ----------------------------------------------------
  # オンデマンド課金(個人利用規模でアクセス頻度が低く予測しづらいため)。
  # 各テーブルはinfrastructure/collection_store.pyのresolve_table_name()が
  # 計算する名前(${TablePrefix}-<file_nameから.jsonを除いたもの>)と一致させる。

  HoldingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-holdings"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stock_code
          AttributeType: S
      KeySchema:
        - AttributeName: stock_code
          KeyType: HASH

  # 保有銘柄オーナー機能移行(データ移行手順M1、2026-08追加): holding_id
  # (owner×stock_codeの合成キー)をパーティションキーとする新テーブル。
  # 既存のHoldingsTable(stock_code単一キー)はそのまま残し(削除しない)。
  # M3(アプリケーション本体切替)以降、PortfolioService/HoldingRepositoryは
  # このテーブルを参照する(旧HoldingsTableはロールバック用に保持されるのみで、
  # 実行時には参照されない)。参照するFunctionのIAM Policyへこのテーブルの
  # ARNを追加し忘れるとAccessDeniedExceptionになる(M4本番検証で実際に発生・
  # 修正した不備。下記の各FunctionのPolicies参照)。
  HoldingsTableV2:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-holdings_v2"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: holding_id
          AttributeType: S
      KeySchema:
        - AttributeName: holding_id
          KeyType: HASH

  PurchaseLotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-purchase_lots"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: lot_id
          AttributeType: S
      KeySchema:
        - AttributeName: lot_id
          KeyType: HASH

  WatchlistTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-watchlist"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stock_code
          AttributeType: S
      KeySchema:
        - AttributeName: stock_code
          KeyType: HASH

  RecommendationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-recommendations"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: recommendation_id
          AttributeType: S
      KeySchema:
        - AttributeName: recommendation_id
          KeyType: HASH

  # 通知検証モード機能(2026-08追加)。投資判断の履歴テーブルではなく、BUY候補
  # fan-out(buy_candidates_handler.py)の各Lambda呼び出し間でVALIDATION実行時の
  # Recommendationを受け渡すための一時的な作業領域。本番RecommendationsTableとは
  # 物理的に分離し、評価/バックテスト/DecisionPerformance等の消費者側コードから
  # は一切参照されない。_finalize_batch正常完了後に明示的に削除されるが、
  # Lambda異常終了等で削除されなかった場合の安全網としてTTLで自動削除する
  # (RecommendationRepository.for_execution_context()参照)。
  ValidationRecommendationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-validation_recommendations"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: recommendation_id
          AttributeType: S
      KeySchema:
        - AttributeName: recommendation_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # --- BUY候補裾野拡大・NEAR BUY監視・通知制御の再設計(2026-08)で追加 -------

  # NEAR BUYの継続監視状態(watch_state_service.py参照)。
  WatchStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-watch_states"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: watch_id
          AttributeType: S
      KeySchema:
        - AttributeName: watch_id
          KeyType: HASH

  # 通知検証モード機能との整合(2026-08追加): VALIDATION実行では本番の
  # WatchStateを一切書き換えないよう分離する(WatchStateRepository.
  # for_execution_context()参照)。
  ValidationWatchStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-validation_watch_states"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: watch_id
          AttributeType: S
      KeySchema:
        - AttributeName: watch_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # 保有銘柄の前回スナップショット。売買イベント検知の差分基準とクールダウン
  # 期限を保持する(trade_cooldown_service.py参照)。
  HoldingsSnapshotTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-holdings_snapshots"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stock_code
          AttributeType: S
      KeySchema:
        - AttributeName: stock_code
          KeyType: HASH

  ValidationHoldingsSnapshotTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-validation_holdings_snapshots"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stock_code
          AttributeType: S
      KeySchema:
        - AttributeName: stock_code
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # 保有銘柄オーナー機能移行(データ移行手順M1、2026-08追加): holding_id単位の
  # TradeCooldown/売買イベント検知状態。M3以降TradeCooldownService(HoldingsSnapshot
  # Repository)が参照する。参照するFunctionのIAM Policyへの追加が必要
  # (HoldingsTableV2の注記参照)。
  HoldingsSnapshotTableV2:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-holdings_snapshots_v2"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: holding_id
          AttributeType: S
      KeySchema:
        - AttributeName: holding_id
          KeyType: HASH

  ValidationHoldingsSnapshotTableV2:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-validation_holdings_snapshots_v2"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: holding_id
          AttributeType: S
      KeySchema:
        - AttributeName: holding_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # 売買イベント検知処理(TradeCooldownService.detect_and_apply)の実行順序
  # 非依存化・冪等性担保用ロック(infrastructure/aws/trade_detection_lock.py
  # 参照)。PK=business_date(値は"NORMAL:2026-08-14"/"VALIDATION:2026-08-14"の
  # ようにExecutionModeで名前空間分離される。コードレビュー対応2026-08:
  # VALIDATIONが先に完了してもNORMALの検知処理をスキップさせないため)。
  # TTLで自動失効する一時データ。
  TradeDetectionRunLockTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-trade_detection_run_locks"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: business_date
          AttributeType: S
      KeySchema:
        - AttributeName: business_date
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # cross-pipeline通知重複抑止(コードレビュー対応2026-08、指摘5)。
  # BUY候補Lambda・保有銘柄Lambdaのどちらから送信した通知でも、当日・同一銘柄の
  # 最も高い優先度をここへ記録し、低優先度の重複通知をbest-effortで抑止する
  # (完全な排他制御ではない)。当日限りのデータのためTTLで自動失効する。
  DailyNotificationPriorityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-daily_notification_priorities"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: record_id
          AttributeType: S
      KeySchema:
        - AttributeName: record_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ValidationDailyNotificationPriorityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-validation_daily_notification_priorities"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: record_id
          AttributeType: S
      KeySchema:
        - AttributeName: record_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # --- 保有判断スコア方式(2026-08仕様)で追加 ------------------------------

  HoldingDecisionResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-holding_decision_results"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: holding_decision_result_id
          AttributeType: S
      KeySchema:
        - AttributeName: holding_decision_result_id
          KeyType: HASH

  InvestmentThesesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-investment_theses"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: investment_thesis_id
          AttributeType: S
      KeySchema:
        - AttributeName: investment_thesis_id
          KeyType: HASH

  InvestmentThesisBaselinesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-investment_thesis_baselines"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: baseline_id
          AttributeType: S
      KeySchema:
        - AttributeName: baseline_id
          KeyType: HASH

  InvestmentThesisBaselineSequencesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-investment_thesis_baseline_sequences"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: holding_id
          AttributeType: S
      KeySchema:
        - AttributeName: holding_id
          KeyType: HASH

  # 保有銘柄オーナー機能移行(データ移行手順M1、2026-08追加): 既存テーブルの
  # holding_id値がstock_codeの1:1エイリアスから所有者付き合成キー
  # (例: "8306"→"本人#8306")へ変わるための新テーブル。既存のcurrent_version
  # はリセットしない — 旧holding_id(stock_code)に紐づくcurrent_versionを、
  # M2の移行スクリプトが新holding_id(本人#stock_code)へそのままコピーし、
  # updated_at等の既存情報もあわせて維持する(旧: holding_id="8306"・
  # current_version=4 → 新: holding_id="本人#8306"・current_version=4 →
  # 移行後のallocate_next_baseline_version()は5から採番される)。既存
  # テーブルはそのまま残す。
  InvestmentThesisBaselineSequencesTableV2:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-investment_thesis_baseline_sequences_v2"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: holding_id
          AttributeType: S
      KeySchema:
        - AttributeName: holding_id
          KeyType: HASH

  InvestmentThesisBaselinePointersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-investment_thesis_baseline_pointers"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: holding_id
          AttributeType: S
      KeySchema:
        - AttributeName: holding_id
          KeyType: HASH

  # 保有銘柄オーナー機能移行(データ移行手順M1、2026-08追加): 新holding_id値で
  # baseline継続性を追跡する新テーブル。あわせて、create/get/updateの永続化
  # 形式が一致していなかった既知の不整合(baseline_pointer.py参照、本番検証で
  # 発見・修正済み)を再現しないよう、data属性全体一致のCAS方式(既に修正済み
  # の実装)をそのまま踏襲する(新テーブル固有の追加対応は不要)。
  InvestmentThesisBaselinePointersTableV2:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-investment_thesis_baseline_pointers_v2"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: holding_id
          AttributeType: S
      KeySchema:
        - AttributeName: holding_id
          KeyType: HASH

  # notification_enabled=false等の安全側フォールバックが機能するよう、書き込みは
  # CLI経由の人間のみに限定する(HoldingsWatchlistFunction等へはReadPolicyのみ付与)。
  HoldingDecisionRuntimeConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-holding_decision_runtime_config"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: config_id
          AttributeType: S
      KeySchema:
        - AttributeName: config_id
          KeyType: HASH

  # 保有銘柄オーナー機能移行(2026-08)のM0: BUY/SELLの一時停止フラグ。書き込みは
  # CLI経由の人間のみ(HoldingDecisionRuntimeConfigTableと同じ運用パターン)。
  # LineWebhookFunctionは読み取り専用(ConversationServiceが起動時・確定直前に
  # 参照する)。WATCHはHoldings/PurchaseLotsを一切更新しないため対象外。
  TradingPauseConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-trading_pause_config"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: config_id
          AttributeType: S
      KeySchema:
        - AttributeName: config_id
          KeyType: HASH

  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
