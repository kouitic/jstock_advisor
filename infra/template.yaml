      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH

  # 銘柄名の手動オーバーライド(2026-07 BUYパイプライン第2次修正・要求仕様19節)。
  StockNameOverridesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-stock_name_overrides"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stock_code
          AttributeType: S
      KeySchema:
        - AttributeName: stock_code
          KeyType: HASH

  EdinetFilingCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-edinet_filing_cache"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stock_code
          AttributeType: S
      KeySchema:
        - AttributeName: stock_code
          KeyType: HASH

  EdinetDisclosureCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-edinet_disclosure_cache"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stock_code
          AttributeType: S
      KeySchema:
        - AttributeName: stock_code
          KeyType: HASH

  # EDINET書類一覧(documents.json?date=D)の日付単位キャッシュ(Issue #53)。
  # 一覧APIは日付単位で「その日の全提出書類」を返すため、銘柄ごとに取得すると
  # 同じ応答を銘柄数だけ取得することになる(ウォッチリスト評価は最大300銘柄)。
  # scan_date(JST暦日)をキーに取得結果を共有し、全Lambdaで再利用する。
  # 物理TTLは450日(document_finderの初期lookback 400暦日より長くしないと、
  # 新規銘柄追加時に古い日付を大量に再取得する構造へ戻るため)。再取得可能な
  # キャッシュのみを保持し、業務データは持たない。
  EdinetDailyDocumentListCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-edinet_daily_document_list_cache"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: scan_date
          AttributeType: S
      KeySchema:
        - AttributeName: scan_date
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # 銘柄単位ファンアウト(_fanout.py)の完了検知用。原子的なADDカウンタとして
  # infrastructure/aws/batch_tracker.pyから直接操作するため、他テーブルと異なり
  # {id_field, data: JSON}形式ではなく数値属性を直接持つ。TTLで数時間後に自動削除する。
  # 通知検証モード機能(2026-08追加)のvalidation_recommendation_ids属性もこのテーブルへ
  # 追記するが、あくまでfan-out完了検知のための一時的な実行制御データであり、
  # 通常運用の投資判断履歴(Recommendation/DecisionSnapshot等)とは性質が異なる。
  BatchRunsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-batch_runs"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: batch_id
          AttributeType: S
      KeySchema:
        - AttributeName: batch_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # 候補ユニバース本格対応(2026-08)。銘柄単位の進捗・冪等性・リース状態を保持する
  # (PK: batch_id, SK: stock_code)。infrastructure/aws/batch_tracker.pyの
  # ウォッチリスト専用関数群(query_all_candidate_progress等)が操作する。
  WatchlistCandidateProgressTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-watchlist_candidate_progress"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: batch_id
          AttributeType: S
        - AttributeName: stock_code
          AttributeType: S
      KeySchema:
        - AttributeName: batch_id
          KeyType: HASH
        - AttributeName: stock_code
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # 本番運用ハードニング(4節)。yfinance系データ(価格/財務・配当)のキャッシュ。
  # services/watchlist_data_cache.pyのCachingProviderBundleが読み書きする
  # (PK: cache_key、汎用CacheEntryをpayload_jsonとして格納)。ウォッチリストの
  # 4Lambdaハンドラのみが使用し、BUY候補・保有銘柄分析パイプラインは対象外。
  # DynamoDBネイティブTTLは設定しない(キー空間が銘柄コード数で自然に有界なため、
  # EdinetFilingCacheTable等の既存キャッシュテーブルと同じ方針。鮮度判定は
  # get_or_fetch側のcached_at比較のみで行う)。
  WatchlistPriceCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-watchlist_price_cache"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cache_key
          AttributeType: S
      KeySchema:
        - AttributeName: cache_key
          KeyType: HASH

  WatchlistFinancialCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-watchlist_financial_cache"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cache_key
          AttributeType: S
      KeySchema:
        - AttributeName: cache_key
          KeyType: HASH

  # ウォッチリスト自動運用の改善(永続ラウンドロビン方式、2026-08)。新規候補選定の
  # 唯一の永続カーソル(単一行、rotation_id="default"固定)。infrastructure/aws/
  # watchlist_rotation_state.pyが楽観ロック(pointer_version)で更新する。TTLは
  # 設定しない(恒久的な状態のため)。
  WatchlistScreeningRotationStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-watchlist_screening_rotation_state"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: rotation_id
          AttributeType: S
      KeySchema:
        - AttributeName: rotation_id
          KeyType: HASH

  # ウォッチリスト自動運用の改善(自動メンテナンス、計画Part C-4)。AUTO_SCREENING
  # 銘柄が自動削除された際の再追加クールダウン判定専用。infrastructure/
  # local_repository/watchlist_removal_history_repository.pyが
  # readd_cooldown_days基準のDynamoDB Native TTL(ttl属性)で自動失効させる
  # (クールダウン終了と同時に行が自動的に消える)。
  WatchlistRemovalHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-watchlist_removal_history"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stock_code
          AttributeType: S
      KeySchema:
        - AttributeName: stock_code
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # 本番検証(2026-08)で発覚した二重起動対応: 約50秒差の2回のDispatcher起動が
  # 同一rotation windowを二重にSQSへdispatchした事象を受け、rotation cursorの
  # CAS(WatchlistScreeningRotationStateTable.pointer_version)とは別責務の軽量
  # leaseを追加した(infrastructure/aws/watchlist_rotation_dispatch_lease.py、
  # trade_detection_run_locksテーブルと同じ単一行・条件付き更新パターン)。
  WatchlistRotationDispatchLeaseTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-watchlist_rotation_dispatch_lease"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: rotation_id
          AttributeType: S
      KeySchema:
        - AttributeName: rotation_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # --- LINEボタン起点会話型UI(2026-08)で追加 -------------------------------
  # BUY/SELL/WATCHのリッチメニュー/postback対話の一時状態(実装プランv2 3節)。
  # ttlはDynamoDB Native TTL(物理削除・掃除用途のみ)であり、実際の期限判定は
  # infrastructure/aws/conversation_state_store.pyがアプリ層で`ttl <= now`を
  # 判定する(物理削除タイミング=最大48時間程度の残存に依存しない設計)。
  ConversationStatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-conversation_states"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # --- Lambda関数(スケジュール実行、schedule.yaml対応) ------------------

  BuyCandidatesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-buy-candidates"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.buy_candidates_handler.handler
      # 24節仕様の再設計(モメンタム・複数手法適正価格・分割調整等)で銘柄あたりの
      # 実データ取得件数が増えたため、既定の300秒では銘柄数によってはタイムアウトしうる
      Timeout: 900
      Environment:
        Variables:
          # Issue #116: Issue #54 Phase B-1のshadow observation
          # (services/jpx_industry_source.py::JpxIndustrySource)が
          # CandidateUniverseCacheIO経由でJPX上場銘柄一覧キャッシュを読むために必要。
          # 本変数が無いとresolve_candidate_universe_bucket()がRuntimeErrorとなり、
          # jpx_lookup_statusが常にSOURCE_UNAVAILABLE(canonical解決率0%)になる。
          # **観測専用**であり、BUY判定・screening・portfolio exposureは
          # classify_industry(provider由来のsector/industry)を使うため影響を受けない。
          CANDIDATE_UNIVERSE_CACHE_BUCKET: !Ref CandidateUniverseCacheBucket
      Policies:
        # コードレビュー対応(2026-08): テーブル数の増加に伴うIAMロールのインライン
        # ポリシー合計サイズ上限(10240バイト)超過を避けるため、HoldingsWatchlistFunction
        # と同様にStatementへ集約する(付与している権限自体はCRUD/Read個別指定時と同一)。
        - Statement:
            - Sid: DynamoDbCrudAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:DeleteItem
                - dynamodb:PutItem
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:UpdateItem
                - dynamodb:BatchWriteItem
                - dynamodb:BatchGetItem
                - dynamodb:DescribeTable
                - dynamodb:ConditionCheckItem
              Resource:
                - !GetAtt AuditLogTable.Arn
                - !Sub "${AuditLogTable.Arn}/index/*"
                - !GetAtt RecommendationsTable.Arn
                - !Sub "${RecommendationsTable.Arn}/index/*"
                # 通知検証モード機能(2026-08追加): VALIDATION実行時のみ使用する一時テーブル
                - !GetAtt ValidationRecommendationsTable.Arn
                - !Sub "${ValidationRecommendationsTable.Arn}/index/*"
                - !GetAtt NotificationLogTable.Arn
                - !Sub "${NotificationLogTable.Arn}/index/*"
                # LINE通知dedupの原子化(Issue #17): 送信決定claim
                - !GetAtt NotificationClaimsTable.Arn
                - !GetAtt EdinetFilingCacheTable.Arn
                - !Sub "${EdinetFilingCacheTable.Arn}/index/*"
                - !GetAtt EdinetDisclosureCacheTable.Arn
                - !Sub "${EdinetDisclosureCacheTable.Arn}/index/*"
                - !GetAtt EdinetDailyDocumentListCacheTable.Arn
                - !Sub "${EdinetDailyDocumentListCacheTable.Arn}/index/*"
                - !GetAtt BatchRunsTable.Arn
                - !Sub "${BatchRunsTable.Arn}/index/*"
                - !GetAtt DecisionSnapshotsTable.Arn
                - !Sub "${DecisionSnapshotsTable.Arn}/index/*"
                - !GetAtt BuyCandidateEvaluationRecordsTable.Arn
                - !Sub "${BuyCandidateEvaluationRecordsTable.Arn}/index/*"
                # LINE UI第二弾「対象確認」機能(2026-08)向け。latest completed
                # batch pointerの書き込み(_finalize_batch()のみ、NORMAL運用かつ
                # 全対象銘柄分のEvaluationRecord保存成功時)。
                - !GetAtt BuyCandidateBatchCompletionTable.Arn
                - !Sub "${BuyCandidateBatchCompletionTable.Arn}/index/*"
                - !GetAtt WatchStateTable.Arn
                - !Sub "${WatchStateTable.Arn}/index/*"
                - !GetAtt ValidationWatchStateTable.Arn
                - !Sub "${ValidationWatchStateTable.Arn}/index/*"
                - !GetAtt HoldingsSnapshotTable.Arn
                - !Sub "${HoldingsSnapshotTable.Arn}/index/*"
                - !GetAtt ValidationHoldingsSnapshotTable.Arn
                - !Sub "${ValidationHoldingsSnapshotTable.Arn}/index/*"
                # M4本番検証で発覚したIAM不備の修正(2026-08): TradeCooldownService.
                # detect_and_apply()がHoldingsSnapshotRepository経由でV2テーブルを
                # 参照する(M3切替済み)。旧HoldingsSnapshotTable/ValidationHoldings
                # SnapshotTable(直上)は削除せずロールバック用に残し、V2を追加する。
                - !GetAtt HoldingsSnapshotTableV2.Arn
                - !Sub "${HoldingsSnapshotTableV2.Arn}/index/*"
                - !GetAtt ValidationHoldingsSnapshotTableV2.Arn
                - !Sub "${ValidationHoldingsSnapshotTableV2.Arn}/index/*"
                - !GetAtt TradeDetectionRunLockTable.Arn
                - !Sub "${TradeDetectionRunLockTable.Arn}/index/*"
                - !GetAtt DailyNotificationPriorityTable.Arn
                - !Sub "${DailyNotificationPriorityTable.Arn}/index/*"
                - !GetAtt ValidationDailyNotificationPriorityTable.Arn
                - !Sub "${ValidationDailyNotificationPriorityTable.Arn}/index/*"
            # 統合BUY候補パイプライン(2026-07)で保有銘柄を購入判断対象へ統合したため追加
            - Sid: DynamoDbReadOnlyAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:BatchGetItem
                - dynamodb:DescribeTable
              Resource:
                - !GetAtt WatchlistTable.Arn
                - !Sub "${WatchlistTable.Arn}/index/*"
                - !GetAtt HoldingsTable.Arn
                - !Sub "${HoldingsTable.Arn}/index/*"
                # M4本番検証で発覚したIAM不備の修正(2026-08): PortfolioService.
                # list_holdings()/list_holdings_by_stock()がHoldingRepository経由で
                # V2テーブルを参照する(M3切替済み)。旧HoldingsTable(直上)は
                # 削除せずロールバック用に残し、V2を追加する。
                - !GetAtt HoldingsTableV2.Arn
                - !Sub "${HoldingsTableV2.Arn}/index/*"
                - !GetAtt PurchaseLotsTable.Arn
                - !Sub "${PurchaseLotsTable.Arn}/index/*"
                - !GetAtt ShareholderBenefitsTable.Arn
                - !Sub "${ShareholderBenefitsTable.Arn}/index/*"
                - !GetAtt CorporateActionRegistryTable.Arn
                - !Sub "${CorporateActionRegistryTable.Arn}/index/*"
                - !GetAtt RuleVersionsTable.Arn
                - !Sub "${RuleVersionsTable.Arn}/index/*"
                - !GetAtt StockNameOverridesTable.Arn
                - !Sub "${StockNameOverridesTable.Arn}/index/*"
        # 銘柄単位のファンアウト(_fanout.py)のため、自分自身を非同期呼び出しする権限が必要
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-buy-candidates"
        # Issue #116: Issue #54 Phase B-1のshadow observation専用の読み取り権限。
        # SAMのS3ReadPolicyは使わない(GetObjectAcl/GetLifecycleConfiguration等、
        # 本経路が使わないActionまで付与されるため)。
        #
        # CandidateUniverseCacheIO.read_current()はcurrent/<source>/data と
        # current/<source>/metadata.json の2キーへget_object()するだけであり、
        # list_objects_v2/head_objectは呼ばない。書き込み(promote())は
        # WatchlistDispatcherFunction側の責務。
        #
        # #116の契約では「キャッシュ未生成」も「S3読み取り不能」もいずれも
        # SOURCE_UNAVAILABLEとしてfail-softするため、両者を区別しない。
        # よってNoSuchKey(404)を得る目的だけのs3:ListBucketは付与しない
        # (最小権限を優先する)。
        - Statement:
            - Sid: CandidateUniverseCacheReadForJpxShadow
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${CandidateUniverseCacheBucket.Arn}/current/*"
      Events:
        DailyMorning:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 8 ? * MON-FRI *)"
            ScheduleExpressionTimezone: Asia/Tokyo
            FlexibleTimeWindow:
              Mode: "OFF"

  HoldingsWatchlistFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-holdings-watchlist"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.holdings_watchlist_handler.handler
      # 保有銘柄27件+ウォッチリストを、24節仕様の再設計後の判定ロジック
      # (モメンタム・複数手法適正価格・分割調整等)で処理するため、既定の300秒では
      # 不足する。Lambdaの最大値である900秒まで引き上げる
      Timeout: 900
      Policies:
        # コードレビュー対応(2026-08): テーブル数の増加に伴い、DynamoDBCrudPolicy/
        # DynamoDBReadPolicyをテーブルごとに個別指定すると、各エントリがロールへ
        # 個別のインラインポリシーとして追加され、IAMロールのインラインポリシー
        # 合計サイズ上限(10240バイト)を超過してデプロイに失敗する不具合が生じた。
        # 同じアクション集合を持つテーブル群をStatementへ集約し、ポリシー
        # エントリ数を削減する(付与している権限自体はCRUD/Read個別指定時と同一)。
        - Statement:
            - Sid: DynamoDbCrudAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:DeleteItem
                - dynamodb:PutItem
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:UpdateItem
                - dynamodb:BatchWriteItem
                - dynamodb:BatchGetItem
                - dynamodb:DescribeTable
                - dynamodb:ConditionCheckItem
              Resource:
                - !GetAtt AuditLogTable.Arn
                - !Sub "${AuditLogTable.Arn}/index/*"
                - !GetAtt RecommendationsTable.Arn
                - !Sub "${RecommendationsTable.Arn}/index/*"
                - !GetAtt NotificationLogTable.Arn
                - !Sub "${NotificationLogTable.Arn}/index/*"
                # LINE通知dedupの原子化(Issue #17): 送信決定claim
                - !GetAtt NotificationClaimsTable.Arn
                - !GetAtt EdinetFilingCacheTable.Arn
                - !Sub "${EdinetFilingCacheTable.Arn}/index/*"
                - !GetAtt EdinetDisclosureCacheTable.Arn
                - !Sub "${EdinetDisclosureCacheTable.Arn}/index/*"
                - !GetAtt EdinetDailyDocumentListCacheTable.Arn
                - !Sub "${EdinetDailyDocumentListCacheTable.Arn}/index/*"
                - !GetAtt BatchRunsTable.Arn
                - !Sub "${BatchRunsTable.Arn}/index/*"
                - !GetAtt HoldingDecisionResultsTable.Arn
                - !Sub "${HoldingDecisionResultsTable.Arn}/index/*"
                - !GetAtt InvestmentThesesTable.Arn
                - !Sub "${InvestmentThesesTable.Arn}/index/*"
                - !GetAtt InvestmentThesisBaselinesTable.Arn
                - !Sub "${InvestmentThesisBaselinesTable.Arn}/index/*"
                - !GetAtt InvestmentThesisBaselineSequencesTable.Arn
                - !Sub "${InvestmentThesisBaselineSequencesTable.Arn}/index/*"
                - !GetAtt InvestmentThesisBaselinePointersTable.Arn
                - !Sub "${InvestmentThesisBaselinePointersTable.Arn}/index/*"
                # M4本番検証で発覚したIAM不備の修正(2026-08): InvestmentThesisService
                # (baseline_sequence.py/baseline_pointer.py)がM3切替済みのV2テーブルを
                # 参照する。旧テーブル(直上2件)は削除せずロールバック用に残し、V2を追加する。
                - !GetAtt InvestmentThesisBaselineSequencesTableV2.Arn
                - !Sub "${InvestmentThesisBaselineSequencesTableV2.Arn}/index/*"
                - !GetAtt InvestmentThesisBaselinePointersTableV2.Arn
                - !Sub "${InvestmentThesisBaselinePointersTableV2.Arn}/index/*"
                - !GetAtt DecisionSnapshotsTable.Arn
                - !Sub "${DecisionSnapshotsTable.Arn}/index/*"
                - !GetAtt WatchStateTable.Arn
                - !Sub "${WatchStateTable.Arn}/index/*"
                - !GetAtt ValidationWatchStateTable.Arn
                - !Sub "${ValidationWatchStateTable.Arn}/index/*"
                - !GetAtt HoldingsSnapshotTable.Arn
                - !Sub "${HoldingsSnapshotTable.Arn}/index/*"
                - !GetAtt ValidationHoldingsSnapshotTable.Arn
                - !Sub "${ValidationHoldingsSnapshotTable.Arn}/index/*"
                # M4本番検証で発覚したIAM不備の修正(2026-08): TradeCooldownService
                # (HoldingsSnapshotRepository)がM3切替済みのV2テーブルを参照する。
                # 旧テーブル(直上2件)は削除せずロールバック用に残し、V2を追加する。
                - !GetAtt HoldingsSnapshotTableV2.Arn
                - !Sub "${HoldingsSnapshotTableV2.Arn}/index/*"
                - !GetAtt ValidationHoldingsSnapshotTableV2.Arn
                - !Sub "${ValidationHoldingsSnapshotTableV2.Arn}/index/*"
                - !GetAtt TradeDetectionRunLockTable.Arn
                - !Sub "${TradeDetectionRunLockTable.Arn}/index/*"
                - !GetAtt DailyNotificationPriorityTable.Arn
                - !Sub "${DailyNotificationPriorityTable.Arn}/index/*"
                - !GetAtt ValidationDailyNotificationPriorityTable.Arn
                - !Sub "${ValidationDailyNotificationPriorityTable.Arn}/index/*"
                # Phase 2-B「銘柄分析」向け(2026-08)。
                - !GetAtt HoldingEvaluationRecordsTable.Arn
                - !Sub "${HoldingEvaluationRecordsTable.Arn}/index/*"
            # --- 保有判断スコア方式(2026-08仕様)の補足: HoldingDecisionRuntimeConfigTable
            # のみ読み取り専用(書き込みはCLI経由の人間のみ、1節)。他は上記CRUDグループへ含む ---
            - Sid: DynamoDbReadOnlyAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:BatchGetItem
                - dynamodb:DescribeTable
              Resource:
                - !GetAtt HoldingsTable.Arn
                - !Sub "${HoldingsTable.Arn}/index/*"
                # M4本番検証で発覚したIAM不備の修正(2026-08): PortfolioService.
                # list_holdings()・HoldingRepository.get(holding_id)がM3切替済みの
                # V2テーブルを参照する。旧HoldingsTable(直上)は削除せずロールバック
                # 用に残し、V2を追加する。
                - !GetAtt HoldingsTableV2.Arn
                - !Sub "${HoldingsTableV2.Arn}/index/*"
                - !GetAtt PurchaseLotsTable.Arn
                - !Sub "${PurchaseLotsTable.Arn}/index/*"
                - !GetAtt WatchlistTable.Arn
                - !Sub "${WatchlistTable.Arn}/index/*"
                - !GetAtt ShareholderBenefitsTable.Arn
                - !Sub "${ShareholderBenefitsTable.Arn}/index/*"
                - !GetAtt CorporateActionRegistryTable.Arn
                - !Sub "${CorporateActionRegistryTable.Arn}/index/*"
                - !GetAtt RuleVersionsTable.Arn
                - !Sub "${RuleVersionsTable.Arn}/index/*"
                - !GetAtt StockNameOverridesTable.Arn
                - !Sub "${StockNameOverridesTable.Arn}/index/*"
                - !GetAtt HoldingDecisionRuntimeConfigTable.Arn
                - !Sub "${HoldingDecisionRuntimeConfigTable.Arn}/index/*"
        # 銘柄単位のファンアウト(_fanout.py)のため、自分自身を非同期呼び出しする権限が必要
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-holdings-watchlist"
      Events:
        # 買い候補分析(BuyCandidatesFunction)と処理条件・通知タイミングを揃えるため
        # 08:00に変更(2026-07-31改訂)。以前は16:30(当日終値)だったが、買い判定と
        # 同時刻にすることで両方とも前営業日終値を基準に同じ条件で評価するようになる。
        DailyMorning:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 8 ? * MON-FRI *)"
            ScheduleExpressionTimezone: Asia/Tokyo
            FlexibleTimeWindow:
              Mode: "OFF"

  DisclosureCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-disclosure-check"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.disclosure_check_handler.handler
      Timeout: 180
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref HoldingsTable }
        # M4本番検証で発覚したIAM不備の修正(2026-08): DisclosureCheckService.
        # analyze()がPortfolioService.list_holdings()経由でM3切替済みのV2テーブルを
        # 参照する。旧HoldingsTable(直上)は削除せずロールバック用に残し、V2を追加する。
        - DynamoDBReadPolicy: { TableName: !Ref HoldingsTableV2 }
        - DynamoDBCrudPolicy: { TableName: !Ref NotificationLogTable }
        # LINE通知dedupの原子化(Issue #17): 送信決定claim
        - DynamoDBCrudPolicy: { TableName: !Ref NotificationClaimsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref EdinetDisclosureCacheTable }
        - DynamoDBCrudPolicy: { TableName: !Ref EdinetDailyDocumentListCacheTable }
      Events:
        Morning:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 10 ? * MON-FRI *)"
            ScheduleExpressionTimezone: Asia/Tokyo
            FlexibleTimeWindow:
              Mode: "OFF"
        Midday:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(30 12 ? * MON-FRI *)"
            ScheduleExpressionTimezone: Asia/Tokyo
            FlexibleTimeWindow:
              Mode: "OFF"
        Afternoon:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(30 15 ? * MON-FRI *)"
            ScheduleExpressionTimezone: Asia/Tokyo
            FlexibleTimeWindow:
              Mode: "OFF"

  EvaluationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-evaluation"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.evaluation_handler.handler
      # Issue #113: Globals既定の300秒では、蓄積したbacklogをtime budget内で
      # 安全に消化しきれない。「処理が遅いので力技で延ばす」ためではなく、
      # N+1 Scan除去・streaming・run scope cacheを行った上で、
      # get_remaining_time_in_millis()による予算管理のもとで
      # backlogを消化するための実行枠として900秒を割り当てる
      # (MemorySizeはstreaming化により512MBのまま据え置く)。
      Timeout: 900
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref RecommendationsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref EvaluationResultsTable }
        # Issue #114 Phase B1: run summaryをAuditLogへ記録する。
        # 書き込みはAuditLogRepository.save_if_absent()の条件付きPutItemのみで、
        # 読み取り・削除・Scan/Queryは行わない。DynamoDBCrudPolicyでは
        # GetItem/Scan/Query/DeleteItem等まで付いてしまうため、
        # **実際に使うPutItemだけ**を明示する(最小権限)。
        # なお週次改善レビュー側の読み取り権限は#114 Phase B3で追加する
        # (B1では読まないため、ここでは付与しない)。
        - Statement:
            - Sid: PutEvaluationRunSummaryAudit
              Effect: Allow
              Action: dynamodb:PutItem
              Resource:
                - !GetAtt AuditLogTable.Arn
      Events:
        DailyEvening:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 18 ? * MON-FRI *)"
            ScheduleExpressionTimezone: Asia/Tokyo
            FlexibleTimeWindow:
              Mode: "OFF"

  # Issue #113: 定点評価Lambdaが11日以上「一度も成功していない」ことに
  # 気づけなかったため、最低限の検知を追加する。本スタックにはこれ以前
  # CloudWatch AlarmもSNS Topicも1つも存在しなかった。
  # 通知配信基盤(SNS/LINE/GitHub)の新設は本Issueのscope外とし、
  # ここではAlarm stateの可視化までを担保する(AlarmActionsは意図的に付けない)。
  # なお**Lambdaのタイムアウトはerrorsメトリクスに計上される**ため、
  # このErrors Alarmが1本あれば今回の37回の失敗はすべて検知できていた。
  EvaluationFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-evaluation-errors"
      AlarmDescription: >-
        定点評価Lambdaが失敗した(タイムアウトを含む)。Issue #113参照。
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref EvaluationFunction
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # 実行されない時間帯(平日18:00のみ稼働)をALARMにしないため。
      TreatMissingData: notBreaching

  # Timeout(900秒)の80%=720秒に達したら、まだ失敗していなくても
  # 予算超過が近いことを検知する(backlogの発散を早期に捉えるため)。
  EvaluationFunctionDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-evaluation-duration"
      AlarmDescription: >-
        定点評価Lambdaの実行時間がTimeoutの80%(720秒)に達した。Issue #113参照。
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref EvaluationFunction
      Statistic: Maximum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 720000 # ミリ秒。EvaluationFunctionのTimeout 900秒 × 0.8
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # --- ウォッチリスト自動追加(候補ユニバース本格対応・2026-08) ---------------
  # 旧WatchlistAutoAdditionFunction(単一Lambdaの自己再帰fan-out)を、
  # Dispatcher→SQS→Worker、TerminalFailureQueue→Handler、毎時Reconcilerという
  # 4つのLambdaへ分割した(第6版修正プラン)。共通のDynamoDBポリシー・IAM構成:
  # AuditLog/BatchRuns/WatchlistCandidateProgress/WatchlistへのCRUD、Holdings等の
  # 除外判定・データ取得用テーブルへの読み取り。

  WatchlistDispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-watchlist-dispatcher"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.watchlist_dispatcher_handler.handler
      Timeout: 300 # 3/18節: dispatch leaseの算出根拠(300秒+60秒余裕=360秒)
      Environment:
        Variables:
          WATCHLIST_SCREENING_QUEUE_URL: !Ref WatchlistScreeningQueue
          CANDIDATE_UNIVERSE_CACHE_BUCKET: !Ref CandidateUniverseCacheBucket
          ALLOW_FULL_MARKET_SCREENING: !Ref AllowFullMarketScreening
          # 平日毎日起動化(2026-08)対応: NEW_CANDIDATE_SCREENINGの業務finalize
          # 確定後にWATCHLIST_MAINTENANCEを後続起動する際、自分自身(この関数)を
          # 非同期invokeする(watchlist_batch_finalizer.maybe_trigger_maintenance)。
          # Dispatcher自身がfinalizeの最終呼び出し元になるケース(最後のSQS送信
          # 失敗時等)向けに自己参照名を渡す。
          WATCHLIST_DISPATCHER_FUNCTION_NAME: !Sub "${AWS::StackName}-watchlist-dispatcher"
      Policies:
        # ウォッチリスト自動運用の改善(2026-08)でローテーション状態・削除履歴の
        # 2テーブルを追加するのを機に、docs/operations_manual.md 11節の指針に
        # 従いCRUD/ReadをStatementへ集約する(個別DynamoDBCrudPolicyエントリの
        # 積み上げによるIAMロールのインラインポリシー合計サイズ上限(10240バイト)
        # 超過を予防する。付与している権限自体は個別指定時と同一)。
        - Statement:
            - Sid: DynamoDbCrudAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:DeleteItem
                - dynamodb:PutItem
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:UpdateItem
                - dynamodb:BatchWriteItem
                - dynamodb:BatchGetItem
                - dynamodb:DescribeTable
                - dynamodb:ConditionCheckItem
              Resource:
                - !GetAtt AuditLogTable.Arn
                - !Sub "${AuditLogTable.Arn}/index/*"
                - !GetAtt BatchRunsTable.Arn
                - !Sub "${BatchRunsTable.Arn}/index/*"
                - !GetAtt WatchlistCandidateProgressTable.Arn
                - !Sub "${WatchlistCandidateProgressTable.Arn}/index/*"
                - !GetAtt WatchlistTable.Arn
                - !Sub "${WatchlistTable.Arn}/index/*"
                - !GetAtt NotificationLogTable.Arn
                - !Sub "${NotificationLogTable.Arn}/index/*"
                # LINE通知dedupの原子化(Issue #17): 送信決定claim
                - !GetAtt NotificationClaimsTable.Arn
                - !GetAtt EdinetFilingCacheTable.Arn
                - !Sub "${EdinetFilingCacheTable.Arn}/index/*"
                - !GetAtt EdinetDisclosureCacheTable.Arn
                - !Sub "${EdinetDisclosureCacheTable.Arn}/index/*"
                - !GetAtt EdinetDailyDocumentListCacheTable.Arn
                - !Sub "${EdinetDailyDocumentListCacheTable.Arn}/index/*"
                - !GetAtt WatchlistPriceCacheTable.Arn
                - !Sub "${WatchlistPriceCacheTable.Arn}/index/*"
                - !GetAtt WatchlistFinancialCacheTable.Arn
                - !Sub "${WatchlistFinancialCacheTable.Arn}/index/*"
                - !GetAtt WatchlistScreeningRotationStateTable.Arn
                - !Sub "${WatchlistScreeningRotationStateTable.Arn}/index/*"
                - !GetAtt WatchlistRemovalHistoryTable.Arn
                - !Sub "${WatchlistRemovalHistoryTable.Arn}/index/*"
                - !GetAtt WatchlistRotationDispatchLeaseTable.Arn
                - !Sub "${WatchlistRotationDispatchLeaseTable.Arn}/index/*"
            - Sid: DynamoDbReadOnlyAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:BatchGetItem
                - dynamodb:DescribeTable
              Resource:
                - !GetAtt HoldingsTable.Arn
                - !Sub "${HoldingsTable.Arn}/index/*"
                # M4本番検証で発覚したIAM不備の修正(2026-08): WatchlistCandidateCollector
                # の保有銘柄除外判定(list_all())がM3切替済みのV2テーブルを参照する。
                # 旧HoldingsTable(直上)は削除せずロールバック用に残し、V2を追加する。
                - !GetAtt HoldingsTableV2.Arn
                - !Sub "${HoldingsTableV2.Arn}/index/*"
                - !GetAtt ShareholderBenefitsTable.Arn
                - !Sub "${ShareholderBenefitsTable.Arn}/index/*"
                - !GetAtt CorporateActionRegistryTable.Arn
                - !Sub "${CorporateActionRegistryTable.Arn}/index/*"
                - !GetAtt StockNameOverridesTable.Arn
                - !Sub "${StockNameOverridesTable.Arn}/index/*"
        - S3CrudPolicy: { BucketName: !Ref CandidateUniverseCacheBucket }
        - SQSSendMessagePolicy: { QueueName: !GetAtt WatchlistScreeningQueue.QueueName }
        # 平日毎日起動化(2026-08)対応: NEW_CANDIDATE_SCREENINGの業務finalize確定
        # 後にWATCHLIST_MAINTENANCEを後続起動するための自己invoke権限。関数ARNを
        # !GetAttで自己参照すると循環依存になるため、FunctionNameと同じ命名規則
        # (!Sub)で組み立てる。
        - Statement:
            - Sid: SelfInvokeForMaintenanceTrigger
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-watchlist-dispatcher"
      Events:
        # ウォッチリスト新規候補評価・自動メンテナンスの平日毎日起動化(2026-08)。
        # NEW_CANDIDATE_SCREENINGは月曜〜金曜06:00 JST(祝日判定なし)に起動する。
        # 市場取引時間外、既存のBUY候補バッチ(平日08:00 JST)より十分前に完了
        # できる時間帯として選定した。WATCHLIST_MAINTENANCEはもはや独立した
        # 定期Scheduleを持たず、当日のNEW_CANDIDATE_SCREENINGが業務finalizeを
        # 正常に完了した直後の後続処理としてのみ起動する
        # (watchlist_batch_finalizer.maybe_trigger_maintenance、計画Part C-7案A
        # の後続起動版)。従来の土曜07:00 NEW_CANDIDATE_SCREENING・日曜07:00
        # WATCHLIST_MAINTENANCEの独立Scheduleはいずれも廃止した。
        WeekdayMorning:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 6 ? * MON-FRI *)"
            ScheduleExpressionTimezone: Asia/Tokyo
            FlexibleTimeWindow:
              Mode: "OFF"

  WatchlistWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-watchlist-worker"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.watchlist_worker_handler.handler
      Timeout: 180 # 3節
      ReservedConcurrentExecutions: !Ref WatchlistReservedConcurrentExecutions
      Environment:
        Variables:
          # 平日毎日起動化(2026-08)対応: NEW_CANDIDATE_SCREENING最後の候補完了が
          # このWorkerで確定した場合、maybe_finalize()経由でwatchlist_batch_
          # finalizer.maybe_trigger_maintenance()がWatchlistDispatcherFunctionを
          # 非同期invokeする(最も頻度が高い後続起動経路)。
          WATCHLIST_DISPATCHER_FUNCTION_NAME: !Sub "${AWS::StackName}-watchlist-dispatcher"
      Policies:
        # WatchlistDispatcherFunctionと同じ理由(docs/operations_manual.md 11節)で
        # CRUD/ReadをStatementへ集約する。rotation commitとremoval historyの
        # 書き込みはWorker呼び出し連鎖内のfinalizeで発生するため、Worker自身にも
        # 2テーブルへのCRUD権限が必要(計画Part A-5/C-4)。
        - Statement:
            - Sid: DynamoDbCrudAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:DeleteItem
                - dynamodb:PutItem
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:UpdateItem
                - dynamodb:BatchWriteItem
                - dynamodb:BatchGetItem
                - dynamodb:DescribeTable
                - dynamodb:ConditionCheckItem
              Resource:
                - !GetAtt AuditLogTable.Arn
                - !Sub "${AuditLogTable.Arn}/index/*"
                - !GetAtt BatchRunsTable.Arn
                - !Sub "${BatchRunsTable.Arn}/index/*"
                - !GetAtt WatchlistCandidateProgressTable.Arn
                - !Sub "${WatchlistCandidateProgressTable.Arn}/index/*"
                - !GetAtt WatchlistTable.Arn
                - !Sub "${WatchlistTable.Arn}/index/*"
                - !GetAtt NotificationLogTable.Arn
                - !Sub "${NotificationLogTable.Arn}/index/*"
                # LINE通知dedupの原子化(Issue #17): 送信決定claim
                - !GetAtt NotificationClaimsTable.Arn
                - !GetAtt EdinetFilingCacheTable.Arn
                - !Sub "${EdinetFilingCacheTable.Arn}/index/*"
                - !GetAtt EdinetDisclosureCacheTable.Arn
                - !Sub "${EdinetDisclosureCacheTable.Arn}/index/*"
                - !GetAtt EdinetDailyDocumentListCacheTable.Arn
                - !Sub "${EdinetDailyDocumentListCacheTable.Arn}/index/*"
                - !GetAtt WatchlistPriceCacheTable.Arn
                - !Sub "${WatchlistPriceCacheTable.Arn}/index/*"
                - !GetAtt WatchlistFinancialCacheTable.Arn
                - !Sub "${WatchlistFinancialCacheTable.Arn}/index/*"
                - !GetAtt WatchlistScreeningRotationStateTable.Arn
                - !Sub "${WatchlistScreeningRotationStateTable.Arn}/index/*"
                - !GetAtt WatchlistRemovalHistoryTable.Arn
                - !Sub "${WatchlistRemovalHistoryTable.Arn}/index/*"
                - !GetAtt WatchlistRotationDispatchLeaseTable.Arn
                - !Sub "${WatchlistRotationDispatchLeaseTable.Arn}/index/*"
            - Sid: DynamoDbReadOnlyAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:BatchGetItem
                - dynamodb:DescribeTable
              Resource:
                - !GetAtt HoldingsTable.Arn
                - !Sub "${HoldingsTable.Arn}/index/*"
                - !GetAtt ShareholderBenefitsTable.Arn
                - !Sub "${ShareholderBenefitsTable.Arn}/index/*"
                - !GetAtt CorporateActionRegistryTable.Arn
                - !Sub "${CorporateActionRegistryTable.Arn}/index/*"
                - !GetAtt StockNameOverridesTable.Arn
                - !Sub "${StockNameOverridesTable.Arn}/index/*"
        # 平日毎日起動化(2026-08)対応: NEW_CANDIDATE_SCREENING最後の候補完了時、
        # maybe_trigger_maintenance()がWatchlistDispatcherFunctionを非同期invoke
        # する(WatchlistDispatcherFunction定義側の同名Statementと同じ理由)。
        - Statement:
            - Sid: InvokeDispatcherForMaintenanceTrigger
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-watchlist-dispatcher"
      Events:
        ScreeningQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt WatchlistScreeningQueue.Arn
            BatchSize: !Ref WatchlistSqsBatchSize
            MaximumBatchingWindowInSeconds: 0

  WatchlistTerminalFailureHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-watchlist-terminal-failure-handler"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.watchlist_terminal_failure_handler.handler
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AuditLogTable }
        - DynamoDBCrudPolicy: { TableName: !Ref BatchRunsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WatchlistCandidateProgressTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WatchlistTable }
        - DynamoDBCrudPolicy: { TableName: !Ref NotificationLogTable }
        # LINE通知dedupの原子化(Issue #17): 送信決定claim
        - DynamoDBCrudPolicy: { TableName: !Ref NotificationClaimsTable }
        - DynamoDBReadPolicy: { TableName: !Ref HoldingsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref EdinetFilingCacheTable }
        - DynamoDBCrudPolicy: { TableName: !Ref EdinetDisclosureCacheTable }
        - DynamoDBCrudPolicy: { TableName: !Ref EdinetDailyDocumentListCacheTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WatchlistPriceCacheTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WatchlistFinancialCacheTable }
        - DynamoDBReadPolicy: { TableName: !Ref ShareholderBenefitsTable }
        - DynamoDBReadPolicy: { TableName: !Ref CorporateActionRegistryTable }
        - DynamoDBReadPolicy: { TableName: !Ref StockNameOverridesTable }
      Events:
        TerminalFailureQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt WatchlistTerminalFailureQueue.Arn
            BatchSize: 10

  WatchlistBatchReconcilerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-watchlist-batch-reconciler"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.watchlist_batch_reconciler_handler.handler
      Timeout: 300
      Environment:
        Variables:
          # 平日毎日起動化(2026-08)対応: retry_finalize()経由、または
          # list_stale_maintenance_triggers()によるinvoke失敗リトライ経由で
          # maybe_trigger_maintenance()がWatchlistDispatcherFunctionを
          # 非同期invokeする。
          WATCHLIST_DISPATCHER_FUNCTION_NAME: !Sub "${AWS::StackName}-watchlist-dispatcher"
          # Issue #57 Phase B2: finalizeが未完了のbuy/holdingsバッチを検出した際、
          # 当該Lambdaへ「締めくくり処理のみ」の非同期invokeを発行する
          # (recovery_action=FINALIZE_ONLY)。銘柄評価等のworker処理は再実行しない。
          BUY_CANDIDATES_FUNCTION_NAME: !Sub "${AWS::StackName}-buy-candidates"
          HOLDINGS_WATCHLIST_FUNCTION_NAME: !Sub "${AWS::StackName}-holdings-watchlist"
      Policies:
        # 本番検証(2026-08)で発覚: retry_finalize()経由でDispatcher/Worker
        # と同じ_finalize_completed()/_maybe_commit_rotation()を呼ぶため、
        # 従来から本来はWatchlistScreeningRotationStateTable/
        # WatchlistRemovalHistoryTableへのCRUD権限が必要だったが付与漏れが
        # あった(今回、二重dispatch防止leaseテーブルの追加を機に同時是正)。
        # Dispatcher/Worker同様、個別DynamoDBCrudPolicy積み上げによるIAM
        # インラインポリシーサイズ上限予防のためStatementへ集約する
        # (docs/operations_manual.md 11節)。
        - Statement:
            - Sid: DynamoDbCrudAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:DeleteItem
                - dynamodb:PutItem
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:UpdateItem
                - dynamodb:BatchWriteItem
                - dynamodb:BatchGetItem
                - dynamodb:DescribeTable
                - dynamodb:ConditionCheckItem
              Resource:
                - !GetAtt AuditLogTable.Arn
                - !Sub "${AuditLogTable.Arn}/index/*"
                - !GetAtt BatchRunsTable.Arn
                - !Sub "${BatchRunsTable.Arn}/index/*"
                - !GetAtt WatchlistCandidateProgressTable.Arn
                - !Sub "${WatchlistCandidateProgressTable.Arn}/index/*"
                - !GetAtt WatchlistTable.Arn
                - !Sub "${WatchlistTable.Arn}/index/*"
                - !GetAtt NotificationLogTable.Arn
                - !Sub "${NotificationLogTable.Arn}/index/*"
                # LINE通知dedupの原子化(Issue #17): 送信決定claim
                - !GetAtt NotificationClaimsTable.Arn
                - !GetAtt EdinetFilingCacheTable.Arn
                - !Sub "${EdinetFilingCacheTable.Arn}/index/*"
                - !GetAtt EdinetDisclosureCacheTable.Arn
                - !Sub "${EdinetDisclosureCacheTable.Arn}/index/*"
                - !GetAtt EdinetDailyDocumentListCacheTable.Arn
                - !Sub "${EdinetDailyDocumentListCacheTable.Arn}/index/*"
                - !GetAtt WatchlistPriceCacheTable.Arn
                - !Sub "${WatchlistPriceCacheTable.Arn}/index/*"
                - !GetAtt WatchlistFinancialCacheTable.Arn
                - !Sub "${WatchlistFinancialCacheTable.Arn}/index/*"
                - !GetAtt WatchlistScreeningRotationStateTable.Arn
                - !Sub "${WatchlistScreeningRotationStateTable.Arn}/index/*"
                - !GetAtt WatchlistRemovalHistoryTable.Arn
                - !Sub "${WatchlistRemovalHistoryTable.Arn}/index/*"
                - !GetAtt WatchlistRotationDispatchLeaseTable.Arn
                - !Sub "${WatchlistRotationDispatchLeaseTable.Arn}/index/*"
            - Sid: DynamoDbReadOnlyAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:BatchGetItem
                - dynamodb:DescribeTable
              Resource:
                - !GetAtt HoldingsTable.Arn
                - !Sub "${HoldingsTable.Arn}/index/*"
                - !GetAtt ShareholderBenefitsTable.Arn
                - !Sub "${ShareholderBenefitsTable.Arn}/index/*"
                - !GetAtt CorporateActionRegistryTable.Arn
                - !Sub "${CorporateActionRegistryTable.Arn}/index/*"
                - !GetAtt StockNameOverridesTable.Arn
                - !Sub "${StockNameOverridesTable.Arn}/index/*"
        # 平日毎日起動化(2026-08)対応: WatchlistDispatcherFunction定義側の
        # 同名Statementと同じ理由(maybe_trigger_maintenanceの再試行invoke)。
        - Statement:
            - Sid: InvokeDispatcherForMaintenanceTrigger
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-watchlist-dispatcher"
        # Issue #57 Phase B2: buy/holdingsのfinalize recovery。締めくくり処理のみを
        # 再実行させるため当該Lambdaを非同期invokeする(recovery_action=FINALIZE_ONLY)。
        # ワイルドカードは使わず、対象2関数のARNだけを列挙する。
        - Statement:
            - Sid: InvokeForCompletionFinalizeRecovery
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-buy-candidates"
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-holdings-watchlist"
      Events:
        Hourly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "rate(1 hour)"
            FlexibleTimeWindow:
              Mode: "OFF"

  WeeklyReviewFunction:
    # 振り返り機能改修(2026-08): 全期間合算レポートのLINE自動送信(旧
    # ReviewReportService経由)から、前週に確定した評価を分析し改善候補を検出・
    # GitHub Issue自動起票する週次改善レビュー(WeeklyImprovementReviewService)へ
    # 置き換えた。RuleProposalsTableは新ロジックでは参照しない(手動CLI
    # `jstock rules propose`専用のまま)。
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-weekly-review"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.weekly_review_handler.handler
      Environment:
        Variables:
          # GitHub App秘密鍵は環境変数へ直接展開せず、ARNのみを渡し実行時に
          # secretsmanager:GetSecretValueで取得する(値そのものをログ・環境変数へ
          # 残さないため)。GitHub App未設定の間はissue_creation_enabled=falseに
          # より参照されない(config/review_improvement.yaml参照)。
          GITHUB_APP_SECRET_ARN: !Ref GithubAppSecretArn
          GITHUB_REPOSITORY: !Ref GithubRepository
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref EvaluationResultsTable }
        - DynamoDBReadPolicy: { TableName: !Ref RecommendationsTable }
        - DynamoDBReadPolicy: { TableName: !Ref RuleVersionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WeeklyReviewMetricsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ImprovementCandidatesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ImprovementTasksTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AuditLogTable }
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref GithubAppSecretArn
      Events:
        MondayEvening:
          Type: ScheduleV2
          Properties:
            # 前週(月〜日 JST)を完全に確定させてから分析するため、その日の
            # point_in_time_evaluation(平日18:00)完了後に実行する。
            ScheduleExpression: "cron(0 19 ? * MON *)"
            ScheduleExpressionTimezone: Asia/Tokyo
            FlexibleTimeWindow:
              Mode: "OFF"

  MonthlyReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-monthly-review"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.monthly_review_handler.handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref EvaluationResultsTable }
        - DynamoDBReadPolicy: { TableName: !Ref RecommendationsTable }
        - DynamoDBReadPolicy: { TableName: !Ref RuleProposalsTable }
      Events:
        # 毎週土曜に起動し、当月第1土曜日かはLambda側(_scheduling.py)で判定する
        SaturdayMorning:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 10 ? * SAT *)"
            ScheduleExpressionTimezone: Asia/Tokyo
            FlexibleTimeWindow:
              Mode: "OFF"

  QuarterlyReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-quarterly-review"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.quarterly_review_handler.handler
      Events:
        # 毎週土曜に起動し、1/4/7/10月の第1土曜日かはLambda側で判定する
        SaturdayMorning:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 11 ? * SAT *)"
            ScheduleExpressionTimezone: Asia/Tokyo
            FlexibleTimeWindow:
              Mode: "OFF"

  # --- LINE Webhook(API Gateway経由、チャット起点の売買記録・ウォッチ登録) --

  LineWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-line-webhook"
      CodeUri: ../src/
      Handler: jstock_advisor.lambda_handlers.line_webhook_handler.handler
      Timeout: 30
      Environment:
        Variables:
          LINE_CHANNEL_SECRET: !Sub "{{resolve:secretsmanager:${LineChannelSecretSecretArn}:SecretString}}"
          # コードレビュー2026-08-17指摘: 会話型UIの確認画面がbuild_stock_display_name_resolver()
          # 経由で銘柄名解決を試みるが、本関数にS3/StockNameOverridesTableへのアクセス権が
          # 無かったため常に全ソース失敗しstock_codeへフォールバックしていた
          # (画面上「8306(8306)」のように表示される不具合)。JPXソース用のバケット名を渡す。
          CANDIDATE_UNIVERSE_CACHE_BUCKET: !Ref CandidateUniverseCacheBucket
      Policies:
        # LINEボタン起点会話型UI(2026-08)のconversation_commit.pyがTransactWriteItems
        # で複数テーブルを原子的に更新する(実装プランv2 3節)。TransactWriteItemsは
        # 各アイテムの個別アクション(PutItem/DeleteItem/UpdateItem/ConditionCheckItem)
        # のみをIAMが評価し、専用のTransactWriteItemsアクションは存在しない
        # (watchlist_worker_handler.pyのDynamoDbCrudAccess Statementで確認済みの
        # 既存パターンをそのまま踏襲)。DynamoDBCrudPolicyショートハンドはConditionCheckItem
        # を含まないため、カスタムStatementへ集約する。
        - Statement:
            - Sid: DynamoDbCrudAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:DeleteItem
                - dynamodb:PutItem
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:UpdateItem
                - dynamodb:BatchWriteItem
                - dynamodb:BatchGetItem
                - dynamodb:DescribeTable
                - dynamodb:ConditionCheckItem
              Resource:
                - !GetAtt TransactionsTable.Arn
                - !Sub "${TransactionsTable.Arn}/index/*"
                - !GetAtt SkippedRecommendationsTable.Arn
                - !Sub "${SkippedRecommendationsTable.Arn}/index/*"
                - !GetAtt WatchlistTable.Arn
                - !Sub "${WatchlistTable.Arn}/index/*"
                - !GetAtt HoldingsTable.Arn
                - !Sub "${HoldingsTable.Arn}/index/*"
                # M4本番検証で発覚したIAM不備の修正(2026-08): conversation_service.py
                # (get_holding)・conversation_commit.py(TransactWriteItems)がM3切替
                # 済みのV2テーブルを参照する。旧HoldingsTable(直上)は削除せず
                # ロールバック用に残し、V2を追加する。
                - !GetAtt HoldingsTableV2.Arn
                - !Sub "${HoldingsTableV2.Arn}/index/*"
                - !GetAtt PurchaseLotsTable.Arn
                - !Sub "${PurchaseLotsTable.Arn}/index/*"
                - !GetAtt ConversationStatesTable.Arn
                - !Sub "${ConversationStatesTable.Arn}/index/*"
        - DynamoDBReadPolicy: { TableName: !Ref RecommendationsTable }
        # StockDisplayNameResolverのoverrideソース(手動上書き名称)・JPXソース用
        # (指摘対応、上記CANDIDATE_UNIVERSE_CACHE_BUCKET環境変数とあわせて追加)。
        - DynamoDBReadPolicy: { TableName: !Ref StockNameOverridesTable }
        # LINE UI第二弾(ウォッチリスト/対象確認、2026-08)向け。直近購入判定・
        # 対象確認一覧の読み取り専用アクセス(いずれも書き込みは行わない)。
        - DynamoDBReadPolicy: { TableName: !Ref BuyCandidateEvaluationRecordsTable }
        - DynamoDBReadPolicy: { TableName: !Ref BuyCandidateBatchCompletionTable }
        # Phase 2-B「銘柄分析」向け(2026-08)。SELL/HOLD側の直近評価参照
        # (どのエンジンが判定担当だったかの照会)、読み取り専用。
        - DynamoDBReadPolicy: { TableName: !Ref HoldingEvaluationRecordsTable }
        # レビュー対応(2026-08、本番デプロイ後確認で発覚): Legacy SELL担当の
        # 純粋HOLD銘柄分析(authoritative_audit_log_id経由でAuditLogEntryを直接
        # 取得する経路)にAuditLogTableへの読み取り権限が付与されておらず、
        # AccessDeniedExceptionとなっていた不備を修正。読み取り専用(Write権限は
        # 付与しない)。
        - DynamoDBReadPolicy: { TableName: !Ref AuditLogTable }
        # 保有銘柄オーナー機能移行: BUY/SELL一時停止フラグ。書き込みはCLI経由の
        # 人間のみ(DynamoDBReadPolicyでは不足。commit_buy/commit_sellの
        # TransactWriteItemsがConditionCheckとして参照するためdynamodb:
        # ConditionCheckItemが必須で、DynamoDBReadPolicyのマネージドポリシー
        # テンプレートには含まれないため、専用Statementで明示的に付与する
        # コードレビュー対応)。
        - Statement:
            - Sid: TradingPauseConfigConditionCheckAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:ConditionCheckItem
                - dynamodb:DescribeTable
              Resource:
                - !GetAtt TradingPauseConfigTable.Arn
                - !Sub "${TradingPauseConfigTable.Arn}/index/*"
        - S3ReadPolicy: { BucketName: !Ref CandidateUniverseCacheBucket }
      Events:
        Webhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /webhook
            Method: POST

  WebhookApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod

Outputs:
  WebhookUrl:
    Description: >
      LINE DevelopersコンソールのWebhook URLに設定するエンドポイント。
      デプロイ後、この値を「https://<ここ>/webhook」の形でMessaging API設定に登録する。
      検証(Verify)を押す前に、4つのSecrets Managerシークレットへ値を投入しておくこと。
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
