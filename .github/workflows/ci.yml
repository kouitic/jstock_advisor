name: CI

# 運用ハードニング9節: lint/typecheck/testに加え、秘密情報スキャン(gitleaks)・
# 依存関係の脆弱性スキャン(pip-audit)をCIへ追加する。testジョブは
# requirements-lock.txt(運用ハードニング8節)からインストールし、
# pyproject.tomlの範囲指定ではなく検証済みの固定バージョン集合で実行する。

# Issue #230: feature branch(issue-**)へのpushでもCIを起動する。§4は全体回帰の
# 正本をCIと定めており(LOCAL_FULL_PYTEST_DEFAULT = FORBIDDEN)、一方で運用は
# 「push -> exact diff review -> PR」の順であるため、PRを作るまでレビュー担当も
# 作業者も全体回帰の結果を見られなかった。job定義・required check名は変更しない。
on:
  push:
    branches: [main, "issue-**"]
  pull_request:
  workflow_dispatch:

# Issue #230: 同一branchへ続けてpushしたとき、古い実行を自動でキャンセルする。
# pushとpull_requestでgroupが異なる点に注意(head_refはpull_requestでのみ設定され、
# pushではrefが"refs/heads/<branch>"になる)。これは意図的であり、branchへのpushが
# 同じbranchのPR実行(required checksの出所)をキャンセルしない状態を保つ。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lock.txt
      - run: python -m ruff check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lock.txt
      - run: python -m mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lock.txt
      - run: python -m pytest tests -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 個人情報(実在人物の氏名・個人メール等)の再混入防止(CLAUDE.md恒久ルール、
  # 2026-08-25追加)。gitleaksは秘密情報(APIキー等)用のためこの用途では
  # 検知しない。denylist方式であり全PII検出を保証しない(CLAUDE.md参照)。
  pii-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/scan_for_pii.py

  # commit messageのPII検査(Issue #131)。pii-scanはworking treeのファイル内容
  # しか読まないためcommit messageが隙間になっていた。GitHub APIを使わないので
  # API障害でPRが止まる経路を作らない。既存のpii-scanジョブは変更していない。
  pii-scan-commit-messages:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan commit messages introduced by this PR
        run: >-
          python scripts/scan_commit_messages_pii.py
          "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements-lock.txt
      # Issue #35: 本番Lambda Layerへ実際に入る依存(infra/layer/requirements.txt、
      # 全推移的依存を完全pinした生成物)も監査対象にする。
      - run: pip-audit -r infra/layer/requirements.txt

  # Issue #35: Lambda Layer依存lockのdrift検知。infra/layer/requirements.in(人間が
  # 編集するdirect依存の正本)から標準compileコマンドで再生成した結果が、Git管理
  # されているinfra/layer/requirements.txt(SAM PythonPipBuilderが実際に使う完全pin
  # 生成物)と一致しない場合はFAILさせる(.inだけ変更して再生成を忘れた状態をmainへ
  # 入れないため)。uvバージョン・compile条件はinfra/layer/build-requirements.txtと
  # このコマンド(infra/README.md「Layer dependency lock」に記載の標準コマンド)で
  # ローカルと完全に揃えること。uvは既存出力のpinを範囲内で優先するため、PyPIに
  # 新しいバージョンが出てもこのジョブが勝手に失敗することはない。
  layer-lock-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r infra/layer/build-requirements.txt
      - run: python -m uv pip compile infra/layer/requirements.in -o infra/layer/requirements.txt --python-version 3.12 --python-platform x86_64-unknown-linux-gnu --no-annotate --custom-compile-command "python -m uv pip compile infra/layer/requirements.in -o infra/layer/requirements.txt --python-version 3.12 --python-platform x86_64-unknown-linux-gnu --no-annotate"
      - run: git diff --exit-code -- infra/layer/requirements.txt
