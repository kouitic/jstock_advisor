name: CI

# 運用ハードニング9節: lint/typecheck/testに加え、秘密情報スキャン(gitleaks)・
# 依存関係の脆弱性スキャン(pip-audit)をCIへ追加する。testジョブは
# requirements-lock.txt(運用ハードニング8節)からインストールし、
# pyproject.tomlの範囲指定ではなく検証済みの固定バージョン集合で実行する。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lock.txt
      - run: python -m ruff check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lock.txt
      - run: python -m mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lock.txt
      - run: python -m pytest tests -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 個人情報(実在人物の氏名・個人メール等)の再混入防止(CLAUDE.md恒久ルール、
  # 2026-08-25追加)。gitleaksは秘密情報(APIキー等)用のためこの用途では
  # 検知しない。denylist方式であり全PII検出を保証しない(CLAUDE.md参照)。
  pii-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/scan_for_pii.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements-lock.txt
