name: CI

# ★ 試験用 branch(trial/xdist-967)の workflow。main へ merge しない。#967 の xdist の検証のためだけに、
#   test job だけを残し、workflow_dispatch の入力で pytest の引数を変えて実行する。★
on:
  workflow_dispatch:
    inputs:
      pytest_args:
        description: "pytest へ足す引数(例: -n 4)"
        required: false
        default: ""
      hashseed:
        description: "PYTHONHASHSEED"
        required: false
        default: "0"
      mutate:
        description: "true なら tests/conftest.py の番号を定数 0 にする(重複を起こす変異)"
        required: false
        default: "false"
      label:
        description: "この run の目印"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          nproc
          python -c "import os; print('cpu_count', os.cpu_count())"
          head -n 2 /proc/meminfo
      - run: pip install -r requirements-lock.txt
      - run: pip install pytest-xdist
      - if: ${{ inputs.mutate == 'true' }}
        run: |
          sed -i 's/f"t{next(_store_dir_counter)}"/"t0"/' tests/conftest.py
          git diff --stat
      - run: python -m pytest -q ${{ inputs.pytest_args }}
        env:
          PYTHONHASHSEED: ${{ inputs.hashseed }}
