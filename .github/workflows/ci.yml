name: CI

# ★ 試験用 branch(trial/xdist-970)の workflow。main へ merge しない。#970 の xdist の検証のためだけに、
#   test job だけを残し、workflow_dispatch の入力で pytest の引数を変えて実行する。★
on:
  workflow_dispatch:
    inputs:
      pytest_args:
        description: "pytest へ足す引数(例: -n 4)"
        required: false
        default: ""
      hashseed:
        description: "PYTHONHASHSEED"
        required: false
        default: "0"
      label:
        description: "この run の目印"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          nproc
          python -c "import os; print('cpu_count', os.cpu_count())"
          head -n 2 /proc/meminfo
      - run: pip install -r requirements-lock.txt
      - run: pip install pytest-xdist
      - run: python -m pytest tests -q --durations=30 ${{ inputs.pytest_args }}
        env:
          PYTHONHASHSEED: ${{ inputs.hashseed }}
