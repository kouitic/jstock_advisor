# REGISTRY_IS_NOT_SSOT = YES
# 本ファイルは index である。規則の正本は各 docs であり、
# 本ファイルと食い違う場合は各 docs が優先する。
# 本ファイルは規則本文を持たない。pointer のみを持つ。
#
# 由来 = Issue #337。operation ごとに「どの正本のどの節を読むべきか」を
# 機械可読に引けるようにする。docs/functional_domains.md が
# 「ルール本文を本書へ複製しない。判定材料を提供する」と自己限定しているのと
# 同じ性格の文書である。
#
# ssot_anchor は見出し文字列である。行番号は動くため使わない。
# entry へ規則本文を書き始めたら tests/unit/test_policy_registry.py が落ちる
# (文字列長の上限で検出する)。これは二重正本化の予防である。
#
# operations は既存正本から導出したものであり、新しい操作概念を作っていない。

operations:
  - IMPLEMENTATION_START
  - GIT_PUSH
  - PR_CREATE
  - MERGE
  - ISSUE_CLOSE
  - PRODUCTION_MANUAL_INVOKE
  - CHANGESET_CREATE
  - CHANGESET_EXECUTE

