# 本番ジョブ異常の検知・LINE通知の設定(Issue #132 X-4〔#503〕)。
# CloudWatch Alarm → SNS → IncidentNotifierFunction が、incident(#502の
# fingerprintで識別)の dedup・claimのタイムアウトに使う値をまとめる。
# すべて運用者が変更可能。

version: 1

# 同一fingerprintについて、直近の通知(SENT)からこの時間以内は再通知しない
# (#502 is_duplicate_within_window()の window)。Lambda の retry で同じ障害が
# 3通にならないための抑止時間。
dedup_window_minutes: 30

# claim(CLAIMED状態)を取得してからこの時間を超えたら、他の実行がtakeoverしてよい
# (LINE push成功後SENT記録前にLambdaがcrashした場合の回復用)。
claim_stale_minutes: 5

# Issue #508 / #837: GitHub Issue自動起票の有効/無効。falseの間はGitHub API・
# Secrets Manager呼び出しを一切行わない(正常なスキップ。既存のLINE通知経路には
# 一切影響しない)。
# 出荷値 = true(Issue #837。有効化の準備。USER決定 #122 issuecomment-6174293468 の3)。
# ★ この値が true で、かつ上限値(config/incident_issue_limits.yaml。USER承認の値 = 最小間隔360分・
# 同一fingerprint 2件・全体5件・自動停止10件。#926)が決定済みの構成では、Productionに反映されると
# 実際にGitHub Issueが自動起票される。★
# ★ この値の変更のmerge・mainへの存在は、Productionの有効化ではない ★: Lambda Layerで配布する
# 静的設定のため、Productionの実行時の値が変わるのはChangeSetのEXECUTE(ConfigLayerの新しい版が
# 全関数へ反映されたとき)だけ。ただしmainに入ると次回のrelease SHAに含まれうるため、同梱するかは
# SHA固定の承認時にUSERが判断する(ChangeSetの差分で『ConfigLayerの内容の変更にこのflagが含まれる』
# ことを明示する)。USERの承認(ChangeSet確認後)まで、このPRはDraftのままmergeしない。
# 運用手順書 32.7。falseでも既存のLINE通知は変わらない。
# 過去の経緯: #876でtrueにしたが10/12のリリースでは有効化せずfalseへ戻した(新規Issueの作成に
# occurrence単位のgate・日あたりの上限が無かったため。USER判断 #122 issuecomment-6114810773)。
# 大量起票の抑止機構(#926)はProduction反映済み。
issue_creation_enabled: true

# GitHub Issue作成・コメント投稿の原子的claim(IncidentStateTable)が失効した
# とみなすまでの分数。失効後はGitHub側の実在確認を先に行ってから再claimする
# (二重Issue・二重コメント防止)。
github_issue_claim_timeout_minutes: 10

# 新規作成するGitHub Issueへ付与するlabel。既存の週次改善レビュー機能
# (rule-improvement/auto-generated)とラベル・重複判定・close運用を混在させない
# ため、production-incidentを専用のsearch用labelとする(#132付録の論点)。
issue_labels:
  - production-incident
  - auto-generated
