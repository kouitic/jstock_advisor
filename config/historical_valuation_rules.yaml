# 判定精度向上機能Phase B(Historical Valuation Score)の設定。
# 銘柄自身の過去PER/PBR水準に対して、現在の値がどの位置にあるかを
# -100(過去最高値=最も割高)〜+100(過去最安値=最も割安)のランクベースで
# スコア化する(同業他社・市場平均との比較は対象外。自己過去比較のみ)。
# DecisionSnapshot.historical_valuation_score等(Shadow計測専用)へのみ記録され、
# BUY候補判定・保有判断スコア・旧売却判定・ProfitTaking判定・LINE通知など
# 既存の判定ロジックには一切影響しない。

# アルゴリズム自体(percentile定義・品質フィルタ・coverage/confidence計算式)の
# バージョン。計算方式を変更した場合はここを更新する。
model_version: "historical_valuation_v4"

# PER/PBRそれぞれについて、この点数以上の有効な過去データ(0より大きく、
# 現在値とbasisが一致する値)が無い場合は、その指標をスコア対象から除外する
# (yfinance等から取得できる過去バリュエーションデータは実質年次数点程度と
# 少ないため、点数が少なすぎる状態でのランク付けを避ける)。
min_data_points_required: 2

# PER側コンポーネントとPBR側コンポーネントの加重平均に使う重み。
# 片方のコンポーネントのみ算出可能な場合は、その重みだけで正規化する。
per_weight: 0.5
pbr_weight: 0.5

# 外れ値検出(MAD: median absolute deviation方式)を行うために必要な最低データ
# 件数。これ未満の場合は外れ値判定自体が不安定なため行わない。
outlier_detection_min_data_points: 5
outlier_mad_threshold: 3.5

# 明らかなデータ異常(取得元の不具合等)を機械的に除外するための絶対レンジ。
per_absolute_min: 0.0
per_absolute_max: 500.0
pbr_absolute_min: 0.0
pbr_absolute_max: 50.0

# coverage計算の基準データ件数(この件数以上使えていれば当該コンポーネントの
# データ充足度を1.0とみなす)。
full_confidence_data_points: 4
coverage_high_threshold: 0.8
coverage_medium_threshold: 0.4

# スコア(-100〜+100)をカテゴリへ丸めるための閾値(Shadow記録専用)。
category_thresholds:
  very_cheap: 60.0
  cheap: 20.0
  expensive: -20.0
  very_expensive: -60.0
