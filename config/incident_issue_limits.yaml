# incident の GitHub Issue 自動起票の抑止の上限値(Issue #926。#876 の大量起票への構造的な対策)。
#
# ★ 出荷値は USER が承認した値(#122 の USER_DECISION_RECORD 2026-10-15。#926 の暫定案の採用):
# 最小間隔 360 分 / fingerprint あたり 2 件 / 全体 5 件 / 自動停止しきい値 10 件。
# カウントの集計期間(JST の日付の窓)・境界条件など、既存の意味論は変更しない。
# ★ これだけでは新規 Issue は作られない: config/incident_notification.yaml の issue_creation_enabled が
# false の間は、GitHub への書込を一切行わない(出荷値 false)。有効化は別の USER 承認(ChangeSet 確認後)。
# 値を変えるときは、この YAML を変更して再 deploy する(Lambda Layer の静的設定のため、
# ChangeSet の CREATE / EXECUTE は各 USER の Human Gate)。
# 1 つでも null・不正な値(0 以下・文字列・真偽値)があれば、全項目を未決定として扱う(fail-closed)。
#
# 窓は JST の日付(固定)。停止中(kill switch)の手順は運用手順書を参照。

version: 1

# 同じ fingerprint の新規 Issue を、前回作成からこの分数以上空ける。
new_issue_min_interval_minutes: 360

# JST の日付の窓あたり、1 fingerprint が作れる新規 Issue の数。
new_issue_limit_per_fingerprint: 2

# JST の日付の窓あたり、全体で作れる新規 Issue の数。
new_issue_limit_global: 5

# 全体の上限を超えた試行の数(窓あたり)がこの回数に達したら、GitHub への書込を自動停止にして
# LINE へ 1 回通知する。再開は手動のみ。
auto_stop_denied_threshold: 10
