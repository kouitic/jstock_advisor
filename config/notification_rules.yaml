# LINE通知の再通知ルール設定(要求仕様16節)

version: 1

# 前回通知からこの日数(暦日)が経過したら、同じ判定内容でも再通知する
resend_after_days: 5

# 推奨価格(買値/売値の代表値)がこの割合(%)以上変化したら再通知する
price_change_resend_threshold_pct: 3.0

# 買い候補分析で、1回の実行あたり実際にLINE通知する上限件数。
# 買い候補スコア(100点満点)が高い順に上位N件のみ通知し、残りは通知を見送る
# (要求仕様2026-07追加: 通知の一斉大量送信を防ぐため)
buy_candidate_max_notifications_per_run: 5

# 買い候補分析で、購入条件を満たす銘柄が0件だった場合に、バッチ完了サマリー
# (対象銘柄数・内訳件数)自体をLINEへ送るかどうか(BUYパイプライン第2次修正
# 2026-07追加。要求仕様16節)。falseの場合、0件の日はLINE通知なしとする
# (運用確認のため日次完了通知が必要な場合のみtrueにする)。
send_empty_summary: false

# BUY候補バッチ専用の通知設定(BUYパイプライン第3次修正2026-07追加)。
buy_candidates:
  # 個別銘柄のデータ取得エラーをLINEへ個別送信するか。falseの場合、
  # CloudWatch警告ログ+バッチ完了サマリーの内訳件数(data_insufficient)
  # のみとし、個別LINE送信は行わない(「今日買える銘柄だけを通知する」方針)。
  notify_data_errors: false

# 運用障害通知の設定(BUYパイプライン第3次修正2026-07追加)。
# BUY候補の個別データ取得エラー通知(buy_candidates.notify_data_errors)とは
# 目的が異なるため、意図的に別設定として分離している。
operations:
  # バッチ全体が異常終了した場合に運用向け通知を行うか。
  notify_batch_failure: true
