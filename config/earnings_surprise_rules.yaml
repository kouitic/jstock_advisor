# Earnings Surprise Score v3(判定精度向上機能Phase C)の設定。
#
# 「直近決算が事前の期待に対して良かったか」を-100(強い悪材料サプライズ)〜
# +100(強い好材料サプライズ)で評価する。DecisionSnapshot.earnings_surprise_score等
# (Shadow計測専用)へのみ記録され、BUY候補判定・保有判断スコア・旧売却判定・
# ProfitTaking判定・LINE通知など既存の判定ロジックには一切影響しない。
#
# 実装前調査の結果、Analyst Consensus Surprise(決算実績 vs Yahoo Finance
# Earnings Historyが返すEPS estimate。当該値が決算発表直前時点のコンセンサス
# であったことを独立に検証できるtimestamp証跡は無償データから取得できないため
# LIVE_SHADOW_ONLYとする)のみで構成する。Historical Progress Surprise(今回の進捗率
# vs 過去3〜5年の同一四半期平均)は四半期実績データが直近5四半期(約1.25年)分
# しか取得できず根本的にデータ不足のため実装しない。Guidance Revision(業績予想
# の上方/下方修正)は、開示情報自体がTDnet専用であり本システムの開示Provider
# (EDINET臨時報告書のみ対応)からは構造的に取得できないため実装しない。
#
# コードレビュー対応(v2): Dividend Surprise/Revision成分を除外した。既存の
# DividendComparisonOutcomeは「前年度の完了済み年間配当実績 vs 現在の年間予想
# 配当」の比較結果であり、「今回の決算で配当予想が上方修正/下方修正されたか」
# という意味のデータではないため、これを今回決算のサプライズとして扱うのは
# 意味が異なる(配当方向としての評価はearnings_trend_rules.yamlのdividend_direction
# へ引き続き残す)。Analyst Consensusが取得できない銘柄を、配当データなど他の
# 情報だけを根拠にEVALUATEDにしないよう、単一成分構成へ変更した。
#
# 重要な制約: Analyst Consensus成分に使うEarningsSurpriseRecordは、ライブ評価
# 時点で取得・保存した値をその後のDecisionOutcome分析に使うことのみ安全であり
# (LIVE_SHADOW_ONLY)、過去の評価日を指定して再構成する用途(バックテスト)には
# 使えない(既知の制約)。判定当時に実際に使用した生値(実績EPS・コンセンサス
# 予想EPS・突合した四半期末日・データ出所)はDecisionSnapshot.earnings_surprise_metrics
# へ保存し、後から再現できるようにしている。
#
# コードレビュー対応(v3): NOT_APPLICABLE(決算反映待ち)判定に既存の
# EarningsDecisionRelevance(ProfitTakingが既に使用している、古い決算予定日を
# 無期限に判定停止理由としないための仕組み)を組み合わせるようにした。この
# 設定ファイル自体に新規フィールドは追加していない(domain/signals/
# earnings_surprise.py参照)。

model_version: "earnings_surprise_v3"

# 単一成分だが、他の判定精度向上機能スコアと同じ重み付きcoverage機構を踏襲する。
analyst_consensus_weight: 1.0

# Analyst Consensus成分: surprise_pct(実績EPSがコンセンサス予想を上回った/
# 下回った割合。例0.05=5%上振れ)の段階評価区分(符号付き、昇順)。
analyst_consensus_strong_negative_pct: -0.20
analyst_consensus_negative_pct: -0.05
analyst_consensus_positive_pct: 0.05
analyst_consensus_strong_positive_pct: 0.20

# coverage(利用可能な成分の重み比率)がこの値未満の場合はNOT_EVALUATEDとする。
# 単一成分のためcoverageは実質0か1の二値(analyst consensusが無ければ
# NOT_EVALUATED)。
min_coverage_required: 0.3
coverage_high_threshold: 0.9
coverage_medium_threshold: 0.5

# スコア(-100〜+100)をカテゴリへ丸めるための閾値(Shadow記録専用)。
category_thresholds:
  strong_positive: 50.0
  positive: 15.0
  negative: -15.0
  strong_negative: -50.0
