# DecisionPerformanceService(判定精度向上機能Phase A)がDecision成績評価の対象と
# みなす営業日ホライズン。専用のEvaluationResultを新規生成するためではなく、
# 既存recommendation_evaluation_service.pyが既に生成しているEvaluationResult
# (config/schedule.yamlのevaluation_horizons_business_days・all_types_common)
# のうち、この一覧に含まれるhorizon_business_daysの行だけをDecisionPerformance
# 集計対象として絞り込むために使う(1営業日の短期チェックポイント・7暦日評価は
# 対象外)。
horizons_business_days: [5, 20, 60, 120, 250]
