# モメンタム・トレンド層設定(要求仕様9節)。

version: 1

moving_averages:
  windows: [20, 60, 120, 200]
  slope_lookback_days: 20

high_low:
  high_window_days_short: 20
  high_window_days_long: 60
  drawdown_window_days: 60

volume:
  short_window_days: 5
  long_window_days: 20

rsi:
  period: 14
  overbought_threshold: 70.0
  oversold_threshold: 30.0

macd:
  fast_period: 12
  slow_period: 26
  signal_period: 9

trailing_stop:
  trailing_pct: 8.0

trend_classification:
  strong_trend_rsi_threshold: 60.0

# セクター指数の相対強度は、流動性のあるETFが存在する業種のみ対応する
# (yfinanceには全33業種を網羅する指数が無いため)。未対応業種(下記に載せない業種)は
# NOT_APPLICABLEのまま(0点・NEUTRALとは区別される)。100% mappingは強制しない。
#
# Issue #26(USER決定 2026-09-28): 分類軸 = TOPIX-17(NEXT FUNDS TOPIX-17シリーズ17本)。
# キー = yfinanceのindustry文字列(JPXの「東証33業種→TOPIX-17」の公式対応表とは別の体系。
# 各業種→区分の対応は、通常どの区分の企業群かの事実確認に基づく。判断に迷う業種は載せない)。
# 値 = yfinanceのticker("<証券コード>.T")。get_benchmark_price_historyが登録外symbolとして
# そのままtickerへ渡す(先例: TOPIX = 1306.T)。
# ETFのコード・名称は、運用会社(野村アセットマネジメント NEXT FUNDS)の各銘柄ページで2026-10-03に確認した。
# SHADOW_ONLY: 結果はDecisionSnapshotの記録専用で、BUY/SELL/利確/保有判断・LINE通知には使わない。
