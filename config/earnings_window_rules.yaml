# 決算直前・直後ルール(要求仕様14節)。
#
# 決算発表直前は情報の陳腐化リスクが高く、発表直後は最新の実績が判定に
# 反映されていない可能性があるため、通常の判定に対して特別な扱いをする。

version: 1

# 次回決算発表日までの残り営業日数がこの値以下の場合、「決算直前」とみなす
approaching_window_business_days: 5

# 直近四半期の期末日(fiscal_period_end、決算発表日そのものではない近似指標)
# からの経過暦日数がこの値以下の場合、「決算直後」とみなす
recently_reported_calendar_days: 10

# 利確判定エンジン再レビュー対応(2026-07): 決算までこの営業日数以内の場合、
# 通常のPARTIAL/FULL_PROFIT_TAKE提案を保留してREVIEW_BEFORE_EARNINGSへ、
# WATCHをWATCH_BEFORE_EARNINGSへ調整する(公式確認済みの即時criticalは例外)
profit_taking_suppression_business_days: 3

# 決算待ち判定ロジック修正(コードレビュー対応): 決算予定日から想定される
# 決算期末日までの報告ラグ日数。fiscal_period_endがこの日数以内に更新されて
# いれば、決算発表が財務データへ反映されたとみなす(実際の決算発表日そのものの
# 厳密な突合ではなく近似判定)。
fiscal_period_reporting_lag_days: 60

# 決算予定日経過後、財務データの更新確認をこの時間(時間単位)待っても確認
# できない場合はDELAYEDへ遷移させる。
maximum_data_reflection_wait_hours: 48

# デプロイ前対応: 過去の決算予定日からこの日数以内であれば、財務データが
# 未更新でも現在の判断に関連するとみなす(RELEVANT)。これを超えて経過しても
# なお財務データの更新が確認できない場合はUNKNOWNとし、通常判定を無期限に
# 停止しない(Provider障害・データ提供元の長期停滞への安全策)。
stale_earnings_relevance_days: 10
