# ウォッチリスト自動追加機能(週次スクリーニング)の設定。
# すべてユーザーが変更可能。単位はコメントに明記。

# 機能全体のON/OFF。CLI通常実行(非dry-run)・EventBridge実行の両方で
# 実書き込み前にチェックする。--dry-runはfalseでも実行可能。
enabled: true

# EventBridge(週次自動実行)からの起動だけをON/OFFする。CLI手動実行には影響しない。
weekly_schedule_enabled: true

# ウォッチリストへ1件以上追加があった場合のLINE通知のON/OFF。
# ウォッチリスト自動追加基準の再設計(2026-08)で既定falseへ変更。ウォッチリスト
# 追加はユーザーへ即時売買アクションを求めるものではないため(LINEは明確な
# 売買アクションがある場合のみ送信する方針)。追加結果自体はAudit/CloudWatch/
# CLIで従来どおり確認できる。
notification_enabled: false

candidate_universe:
  # "csv": 固定CSV(旧v1、テスト・小規模検証用に残す)。
  # "jpx": 東証プライム+スタンダード全銘柄を自動取得(候補ユニバース本格対応・2026-08)。
  provider: "jpx"
  csv_path: "data/universe/candidate_universe.csv"
  # JPX上場銘柄一覧(.xls、無料・月次更新)とJPX400構成銘柄CSV(Nikkei、無料・年1回+随時)。
  # provider="jpx"の場合のみ使用する。
  jpx_listed_issues_url: "https://www.jpx.co.jp/markets/statistics-equities/misc/tvdivq0000001vg2-att/data_j.xls"
  jpx_400_weight_url: "https://indexes.nikkei.co.jp/nkave/archives/file/jpx_nikkei_index_400_weight_jp.csv"
  # 東証上場銘柄一覧の「市場・商品区分」列でこの値に一致する行のみ候補とする(プライム+スタンダード)。
  target_market_segments:
    - "プライム（内国株式）"
    - "スタンダード（内国株式）"
  # キャッシュの最大許容経過時間(8節)。source_date基準。超過すると処理中断。
  listed_issues_max_stale_hours: 1080  # 45日
  jpx400_max_stale_hours: 2160  # 90日

# shadow同値性検証(2026-08、150銘柄でDTO差分0件・業務判定差分0件を確認)を経て
# lightweightへ切替。multi_style_monitoringが参照するフィールドのみを取得する
# 高速版(計画Part B-2)。stock_snapshotは後方互換・比較用にコードを残す。
screening_data_provider: "lightweight"

# v1では単一文字列。将来は複数Policyのlist化を検討する。
# ウォッチリスト自動追加基準の再設計(2026-08)で本番既定をmulti_style_monitoringへ
# 変更。旧high_dividend_financial_healthは後方互換・比較用にコードは残すが、
# 本番では使用しない。
screening_policy: "multi_style_monitoring"

# 1回の実行でウォッチリストへ追加する最大件数。ウォッチリスト自動追加基準の
# 再設計(2026-08)で対象が5タイプ(高配当/連続増配/成長/割安/優良)へ広がったため、
# 20→30へ引き上げ(無制限化はしない)。上限外はRANK_OUTSIDE_ADDITION_LIMITとして
# Auditへ記録し、翌週再評価する。
max_watchlist_additions_per_run: 30

# スコア計算に使う項目(missing_scoring_fields)の欠損許容数。
# high_dividend_financial_health(後方互換・比較用Policy)専用。multi_style_monitoring
# (本番既定)はStockTypeClassification側でタイプごとにデータ不足を吸収するため、
# この一律件数方式は使わない(ウォッチリスト自動追加基準の再設計、2026-08)。
max_missing_fields: 1

# --- high_dividend_financial_health(旧Policy)専用。後方互換・比較用に残す。
# 本番既定Policy(multi_style_monitoring)のハード除外はconfig/screening_rules.yaml
# (config.screening)を再利用し、ここには専用の閾値を持たない(ウォッチリスト
# 自動追加基準の再設計、2026-08)。 -----------------------------------------------
thresholds:
  # 時価総額(円)の下限。shares_outstanding * current_priceで算出。
  # multi_style_monitoringでは、この値をMonitoringScoreの規模ボーナス(+2点)の
  # 判定基準としても再利用する(ハード除外としては使わない)。
  minimum_market_cap_yen: 50_000_000_000
  require_positive_operating_cash_flow: true
  exclude_dividend_cut_announced: true
  exclude_debt_excess: true
  exclude_deficit: true
  exclude_going_concern_doubt: true
  exclude_etf: true
  exclude_reit: true

scoring:
  # 合計スコア(100点満点)がこの値以上で合格。
  minimum_total_score: 60.0

  dividend_yield:
    weight: 30.0
    zero_at_pct: 3.5
    full_at_pct: 6.0

  equity_ratio:
    weight: 25.0
    zero_at_pct: 40.0
    full_at_pct: 70.0

  payout_ratio:
    weight: 15.0
    healthy_min_pct: 20.0
    healthy_max_pct: 60.0

  dividend_growth:
    weight: 15.0
    zero_at_years: 0
    full_at_years: 10

  shareholder_benefit:
    weight: 15.0
    yield_full_at_pct: 2.0
    # 優待はあるが利回りが確認できない場合、満点に対してこの割合を付与する。
    presence_only_score_ratio: 0.5

# --- multi_style_monitoring(本番既定Policy)専用。ウォッチリスト自動追加基準の
# 再設計(2026-08)で追加。合否(対象StockTypeへの該当有無)とは独立した、
# ランキング専用スコア。価格の割安さは一切含めない。自己資本比率の閾値は
# config/screening_rules.yamlのfinancial_health.min_equity_ratio_pctを、
# 時価総額の閾値は上記thresholds.minimum_market_cap_yenをそれぞれ再利用する
# (重複定義しない)。100点が上限(コード側で固定)。 -----------------------------
monitoring_score:
  base_score: 60.0
  # 2タイプ目以降、1タイプにつき加算するボーナス(最大3タイプ分=24点)。
  additional_type_bonus: 8.0
  max_type_bonus: 24.0
  equity_ratio_bonus: 5.0
  positive_operating_cashflow_bonus: 5.0
  no_deficit_bonus: 3.0
  no_recent_dividend_cut_bonus: 3.0
  market_cap_bonus: 2.0

# --- 候補ユニバース本格対応(2026-08、第6版修正プラン)で追加 -----------------

# ビジネスロジック上の「これ以上RUNNINGなら異常」判定(時間)。3,122銘柄 x 30〜45秒 ÷
# ReservedConcurrentExecutions(3) = 約8.7〜13.0時間という試算に、429再試行・SQS
# 再配信・コールドスタート等の余裕を載せた値(15節)。
batch_processing_timeout_hours: 24

# DynamoDB TTL(物理削除)。処理タイムアウトより十分長く(3倍)設定する。
batch_record_ttl_hours: 72
candidate_progress_ttl_hours: 72

# Reconcilerのタイムアウト確定処理(TIMEOUT_FINALIZING)1回あたりの処理件数上限。
# 件数ベースの上限とすることで、Reconciler自身のLambda Timeout内で確実に完了できる
# 範囲に収める(17節)。
max_timeout_finalize_rows_per_run: 1000

# TIMED_OUT確定時、途中までの評価結果をウォッチリスト追加・LINE通知に使うか。
# 未評価銘柄がある状態でのランキングは処理順序に依存するため、既定false(14節)。
allow_partial_result_on_timeout: false

# 429疑い件数/処理対象件数がこの値(%)を超えた場合、ABORTED
# (execution_result=HIGH_THROTTLE_RATE)としウォッチリスト追加・通知を行わない(10節)。
high_throttle_rate_threshold_pct: 20.0

staged_rollout:
  # 段階導入用の候補数上限。未設定(null)なら無制限。
  # 例: 100 → 500 → プライムのみ(market_segment_filterで絞り込み) → 全件(両方null)。
  # 安全側のデフォルトとして100件+プライム市場のみに制限している。全件処理へ
  # 拡大する場合は、運用者が明示的にcandidate_limit: nullへ変更したうえで、
  # infra/template.yamlのALLOW_FULL_MARKET_SCREENING環境変数(既定未設定=ブロック)
  # も有効化する必要がある(二重の安全策、運用ハードニング1/2節)。
  candidate_limit: 300
  market_segment_filter: ["プライム（内国株式）"]

# --- 運用ハードニング(2026-08、本番運用レビュー対応)で追加 -------------------

# 429疑い件数/処理対象件数(既存)に加えて、主要スコア項目の欠損率がこの値(%)を
# 超えた場合もABORTED(execution_result=SCORING_DATA_QUALITY_DEGRADED)とし、
# ウォッチリスト追加・LINE通知を行わない。429疑い率が20%未満でも、データ提供元
# 障害でスコア項目が軒並み欠損している週を検知するための独立したしきい値。
# 母数はscreening_input_created_count(ScreeningDataResult.inputが作られた行数、
# 運用ハードニング第2弾3節)。
max_scoring_field_missing_rate_pct: 30.0

# --- 運用ハードニング第2弾(2026-08、レビュー対応)で追加 ----------------------
# いずれもevaluation_attempted_count(またはtotal_candidate_count)を母数とした
# 独立の安全弁。provider_failure_classifierが分類できない未知の障害パターンでも
# 安全に中止できるようにする(5節)。閾値超過時はウォッチリスト追加・通知を
# 行わず、該当した理由をすべて監査ログのabort_reasonsへ記録する。
max_data_error_rate_pct: 15.0
max_not_found_rate_pct: 10.0
max_terminal_failure_rate_pct: 5.0
max_required_field_missing_rate_pct: 20.0

# finalize処理(合否ランキング確定・ウォッチリスト書き込み・LINE通知)が
# FINALIZINGのまま応答が無い場合、この分数を超えたらReconcilerが異常とみなし
# FINALIZE_FAILEDへ強制遷移する(finalize自体は少数銘柄のみを処理するため
# 短い時間で完了するはずという前提)。
finalizing_stuck_threshold_minutes: 15

# FINALIZE_FAILEDになったバッチに対し、Reconcilerが自動的に再試行する最大回数。
# 超過後はCLI(jstock watchlist-screening retry-finalize --execute)による
# 手動対応を待つ(自動再試行は停止する)。
max_finalize_retry_attempts: 3

data_cache:
  # 株価は日次で変わるため短めのTTL。財務・配当情報は週次実行と整合する
  # 7日(168時間)以上のTTLとし、株価とは独立して設定する(運用ハードニング4節)。
  price_cache_ttl_hours: 24
  financial_cache_ttl_hours: 168
  # None・DEGRADED(必須項目が大幅欠損)な値の短期キャッシュTTL(分、運用ハードニング
  # 第2弾1節)。一時的な取得失敗を7日間キャッシュしてしまわないための上限。
  negative_cache_ttl_minutes: 15

# --- 運用ハードニング第3弾(2026-08、レビュー対応)で追加 ----------------------
# LINE通知(notify_watchlist_additions)が例外になりNOTIFICATION_FAILEDになった
# バッチに対し、Reconciler/CLIが自動的に再試行する最大回数。ウォッチリストへの
# 追加自体はNOTIFICATION_FAILED中も維持され、超過後はCOMPLETED_WITH_NOTIFICATION_
# FAILUREとして終端する(1節)。
max_notification_retry_attempts: 3

# --- LINE通知品質改善(2026-08)で追加 ------------------------------------------
stock_display_name:
  # JPX銘柄名キャッシュ(上場銘柄一覧)の取得・パースに失敗した際、直後の連続
  # リトライを防ぐnegative cacheの有効期間(秒)。1以上の整数。本番運用での
  # 調整・テストでの短縮のためconfig化している(固定値のコード内埋め込みは行わない)。
  jpx_name_negative_cache_ttl_seconds: 60

# --- ウォッチリスト自動運用の改善(ローテーション・高速化・自動メンテナンス、2026-08)で追加 ---
rotation:
  # true: 永続ラウンドロビン方式(毎回未評価の候補を優先し、全市場を巡回する)。
  # false: 従来の固定スライス方式(候補ユニバース出現順の先頭からcandidate_limit件)
  # へフォールバックする(移行時の安全弁)。
  enabled: true

auto_removal:
  # AUTO_SCREENING銘柄の自動メンテナンス(再評価・自動削除)自体のON/OFF。
  # MANUAL登録銘柄は常に対象外(このフラグに関わらず保護される)。
  enabled: true
  # 登録からこの日数が経過するまでは、非該当が続いても削除対象にしない
  # (企業として長期監視する価値そのものを保護するため)。
  minimum_age_days: 90
  # この回数だけ連続して非該当(対象5タイプいずれにも非該当、またはハード除外)と
  # 判定された場合に削除候補となる(即時削除対象の理由=REIT/ETF化・債務超過・
  # 継続企業の前提への重大な疑義、を除く)。
  consecutive_not_qualified_required: 3
  # 初回非該当(removal_candidate_since)からこの日数以上経過していることも
  # 削除の必須条件とする。週次実行の場合consecutive_not_qualified_required=3だけ
  # では最短約21日で削除され得るが、この値(既定28日)を追加のAND条件とすることで
  # 一時的な状態変化による拙速な削除を防ぐ。
  minimum_not_qualified_span_days: 28
  # 運用ドキュメント記載用の目安値(メンテナンス実行間隔)。判定ロジックには
  # 直接使わない。
  stale_recheck_days: 30
  # データ取得エラー等で有効な再評価ができないままこの日数を超えた場合、
  # 削除はせず監査記録・運用警告に留める。
  maximum_unconfirmed_days: 180
  # 削除された銘柄が同一条件で再追加されるまでの最低待機日数
  # (削除→即再追加→削除、という振動を防ぐ)。
  readd_cooldown_days: 30
