# ウォッチリスト自動追加機能(週次スクリーニング)の設定。
# すべてユーザーが変更可能。単位はコメントに明記。

# 機能全体のON/OFF。CLI通常実行(非dry-run)・EventBridge実行の両方で
# 実書き込み前にチェックする。--dry-runはfalseでも実行可能。
enabled: true

# EventBridge(週次自動実行)からの起動だけをON/OFFする。CLI手動実行には影響しない。
weekly_schedule_enabled: true

# ウォッチリストへ1件以上追加があった場合のLINE通知のON/OFF。
notification_enabled: true

candidate_universe:
  # "csv": 固定CSV(旧v1、テスト・小規模検証用に残す)。
  # "jpx": 東証プライム+スタンダード全銘柄を自動取得(候補ユニバース本格対応・2026-08)。
  provider: "jpx"
  csv_path: "data/universe/candidate_universe.csv"
  # JPX上場銘柄一覧(.xls、無料・月次更新)とJPX400構成銘柄CSV(Nikkei、無料・年1回+随時)。
  # provider="jpx"の場合のみ使用する。
  jpx_listed_issues_url: "https://www.jpx.co.jp/markets/statistics-equities/misc/tvdivq0000001vg2-att/data_j.xls"
  jpx_400_weight_url: "https://indexes.nikkei.co.jp/nkave/archives/file/jpx_nikkei_index_400_weight_jp.csv"
  # 東証上場銘柄一覧の「市場・商品区分」列でこの値に一致する行のみ候補とする(プライム+スタンダード)。
  target_market_segments:
    - "プライム（内国株式）"
    - "スタンダード（内国株式）"
  # キャッシュの最大許容経過時間(8節)。source_date基準。超過すると処理中断。
  listed_issues_max_stale_hours: 1080  # 45日
  jpx400_max_stale_hours: 2160  # 90日

# v1では"stock_snapshot"のみ有効。将来: "lightweight"
screening_data_provider: "stock_snapshot"

# v1では単一文字列。将来は複数Policyのlist化を検討する。
screening_policy: "high_dividend_financial_health"

# 1回の実行でウォッチリストへ追加する最大件数。
max_watchlist_additions_per_run: 20

# スコア計算に使う項目(missing_scoring_fields)の欠損許容数。
# これを超えるとスコアが合格基準以上でもデータ不足として不合格にする。
max_missing_fields: 1

thresholds:
  # 時価総額(円)の下限。shares_outstanding * current_priceで算出。
  minimum_market_cap_yen: 50_000_000_000
  require_positive_operating_cash_flow: true
  exclude_dividend_cut_announced: true
  exclude_debt_excess: true
  exclude_deficit: true
  exclude_going_concern_doubt: true
  exclude_etf: true
  exclude_reit: true

scoring:
  # 合計スコア(100点満点)がこの値以上で合格。
  minimum_total_score: 60.0

  dividend_yield:
    weight: 30.0
    zero_at_pct: 3.5
    full_at_pct: 6.0

  equity_ratio:
    weight: 25.0
    zero_at_pct: 40.0
    full_at_pct: 70.0

  payout_ratio:
    weight: 15.0
    healthy_min_pct: 20.0
    healthy_max_pct: 60.0

  dividend_growth:
    weight: 15.0
    zero_at_years: 0
    full_at_years: 10

  shareholder_benefit:
    weight: 15.0
    yield_full_at_pct: 2.0
    # 優待はあるが利回りが確認できない場合、満点に対してこの割合を付与する。
    presence_only_score_ratio: 0.5

# --- 候補ユニバース本格対応(2026-08、第6版修正プラン)で追加 -----------------

# ビジネスロジック上の「これ以上RUNNINGなら異常」判定(時間)。3,122銘柄 x 30〜45秒 ÷
# ReservedConcurrentExecutions(3) = 約8.7〜13.0時間という試算に、429再試行・SQS
# 再配信・コールドスタート等の余裕を載せた値(15節)。
batch_processing_timeout_hours: 24

# DynamoDB TTL(物理削除)。処理タイムアウトより十分長く(3倍)設定する。
batch_record_ttl_hours: 72
candidate_progress_ttl_hours: 72

# Reconcilerのタイムアウト確定処理(TIMEOUT_FINALIZING)1回あたりの処理件数上限。
# 件数ベースの上限とすることで、Reconciler自身のLambda Timeout内で確実に完了できる
# 範囲に収める(17節)。
max_timeout_finalize_rows_per_run: 1000

# TIMED_OUT確定時、途中までの評価結果をウォッチリスト追加・LINE通知に使うか。
# 未評価銘柄がある状態でのランキングは処理順序に依存するため、既定false(14節)。
allow_partial_result_on_timeout: false

# 429疑い件数/処理対象件数がこの値(%)を超えた場合、ABORTED
# (execution_result=HIGH_THROTTLE_RATE)としウォッチリスト追加・通知を行わない(10節)。
high_throttle_rate_threshold_pct: 20.0

staged_rollout:
  # 段階導入用の候補数上限。未設定(null)なら無制限。
  # 例: 100 → 500 → プライムのみ(market_segment_filterで絞り込み) → 全件(両方null)。
  # 安全側のデフォルトとして100件+プライム市場のみに制限している。全件処理へ
  # 拡大する場合は、運用者が明示的にcandidate_limit: nullへ変更したうえで、
  # infra/template.yamlのALLOW_FULL_MARKET_SCREENING環境変数(既定未設定=ブロック)
  # も有効化する必要がある(二重の安全策、運用ハードニング1/2節)。
  candidate_limit: 100
  market_segment_filter: ["プライム（内国株式）"]

# --- 運用ハードニング(2026-08、本番運用レビュー対応)で追加 -------------------

# 429疑い件数/処理対象件数(既存)に加えて、主要スコア項目の欠損率がこの値(%)を
# 超えた場合もABORTED(execution_result=PROVIDER_DATA_QUALITY_DEGRADED)とし、
# ウォッチリスト追加・LINE通知を行わない。429疑い率が20%未満でも、データ提供元
# 障害でスコア項目が軒並み欠損している週を検知するための独立したしきい値。
max_field_missing_rate_pct: 30.0

# finalize処理(合否ランキング確定・ウォッチリスト書き込み・LINE通知)が
# FINALIZINGのまま応答が無い場合、この分数を超えたらReconcilerが異常とみなし
# FINALIZE_FAILEDへ強制遷移する(finalize自体は少数銘柄のみを処理するため
# 短い時間で完了するはずという前提)。
finalizing_stuck_threshold_minutes: 15

# FINALIZE_FAILEDになったバッチに対し、Reconcilerが自動的に再試行する最大回数。
# 超過後はCLI(jstock watchlist-screening retry-finalize --execute)による
# 手動対応を待つ(自動再試行は停止する)。
max_finalize_retry_attempts: 3

data_cache:
  # 株価は日次で変わるため短めのTTL。財務・配当情報は週次実行と整合する
  # 7日(168時間)以上のTTLとし、株価とは独立して設定する(運用ハードニング4節)。
  price_cache_ttl_hours: 24
  financial_cache_ttl_hours: 168
