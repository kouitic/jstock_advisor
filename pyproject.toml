[project]
name = "jstock-advisor"
version = "0.1.0"
description = "日本株 長期・高配当・株主優待重視の売買支援システム"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-dateutil>=2.9",
    "jpholiday>=0.1.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "types-python-dateutil",
    "freezegun>=1.5",
]
aws = [
    "boto3>=1.34",
]
aws-dev = [
    "boto3-stubs[dynamodb]>=1.34",
    "moto[dynamodb]>=5.0",
]
realdata = [
    "yfinance>=0.2.40",
]

[project.scripts]
jstock = "jstock_advisor.cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["jstock_advisor"]

[tool.ruff.lint.per-file-ignores]
# typerのOption/Argumentは関数デフォルト引数として呼び出すのが公式の使い方のため許容する
"src/jstock_advisor/cli/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "yfinance.*"
ignore_missing_imports = true
